<!doctype html>
<!--
  simplicio-videos · motion/patterns/kinetic-letters-punch/block.html — Tipografia cinética por letra + punch RGB
  Três linhas de título entram letra a letra (stagger + back.out); a última palavra bate com scale-punch, split RGB e tremida de câmera.
  HyperFrames block (sub-composition), 1080x1920, 2.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/kinetic-letters-punch.html and add
    <div id="..." class="clip" data-composition-id="kinetic-letters-punch" data-composition-src="compositions/kinetic-letters-punch.html"
         data-start="T" data-duration="2.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "kinetic-letters-punch" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="kinetic-letters-punch"].
  Extraído do showreel piloto de assistência técnica (cena S1).
-->
<html lang="pt-BR" data-composition-id="kinetic-letters-punch" data-composition-duration="2.0" data-composition-variables='[{"id": "line1", "type": "string", "label": "Linha 1", "default": "Seu", "maxLength": 14}, {"id": "line2", "type": "string", "label": "Linha 2", "default": "negócio", "maxLength": 14}, {"id": "line3", "type": "string", "label": "Linha 3 (punch)", "default": "parado?", "maxLength": 12}, {"id": "t3", "type": "string", "label": "Tempo da palavra punch (s)", "default": "0.68"}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Tipografia cinética por letra + punch RGB</title>
  </head>
  <body>
    <template>
      <div id="kinetic-letters-punch-root" data-composition-id="kinetic-letters-punch" data-duration="2.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="kinetic-letters-punch"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="kinetic-letters-punch"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="kinetic-letters-punch"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="kinetic-letters-punch"] .cam { position: absolute; inset: 0; }
          [data-composition-id="kinetic-letters-punch"] .title { position: absolute; left: 80px; right: 80px; top: 560px; font-size: 230px; }
          [data-composition-id="kinetic-letters-punch"] .title .ln { display: block; overflow: hidden; padding: 34px 0 8px; margin-top: -34px; } /* room for pt-BR accents (Ã, Ó) */
          [data-composition-id="kinetic-letters-punch"] .title .l3 { color: var(--primary); overflow: visible; }
        </style>
        <div class="cam">
          <h1 class="title anton"><span class="ln l1"></span><span class="ln l2"></span><span class="ln l3"></span></h1>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"line1": "Seu", "line2": "negócio", "line3": "parado?", "t3": "0.68", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("kinetic-letters-punch-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const c1 = splitChars($(".l1"), V.line1), c2 = splitChars($(".l2"), V.line2), c3 = splitChars($(".l3"), V.line3);
            const t3 = +V.t3;
            tl.fromTo(c1, { yPercent: 115 }, { yPercent: 0, duration: 0.25, stagger: 0.03, ease: "back.out(2.2)" }, 0.12);
            tl.fromTo(c2, { yPercent: 115, rotation: 8 }, { yPercent: 0, rotation: 0, duration: 0.28, stagger: 0.02, ease: "back.out(2.2)" }, 0.38);
            tl.fromTo(c3, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, stagger: 0.02, ease: "power4.out" }, t3);
            tl.fromTo($(".l3"), { textShadow: RGB(26) }, { textShadow: RGB(0), duration: 0.5, ease: "power2.out" }, t3 + 0.32);
            tl.fromTo($(".cam"), { scale: 1 }, { scale: 1.1, duration: 0.18, ease: "power4.in" }, t3 + 0.14);
            tl.to($(".cam"), { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, t3 + 0.32);
            tl.fromTo($(".cam"), { y: 0 }, { y: 14, duration: 0.035, repeat: 7, yoyo: true, ease: "none", immediateRender: false }, t3 + 0.32);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["kinetic-letters-punch"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
