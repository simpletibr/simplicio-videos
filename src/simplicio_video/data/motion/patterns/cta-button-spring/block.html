<!doctype html>
<!--
  simplicio-videos · motion/patterns/cta-button-spring/block.html — CTA: título por letra + botão com mola e respiração
  Título do CTA entra letra a letra com rotação, botão (ex.: WhatsApp) salta com mola e 'respira' no tempo em que o canal é falado; linha de contato sobe.
  HyperFrames block (sub-composition), 1080x1920, 3.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/cta-button-spring.html and add
    <div id="..." class="clip" data-composition-id="cta-button-spring" data-composition-src="compositions/cta-button-spring.html"
         data-start="T" data-duration="3.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "cta-button-spring" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="cta-button-spring"].
  Extraído do showreel piloto de assistência técnica (cena S6).
-->
<html lang="pt-BR" data-composition-id="cta-button-spring" data-composition-duration="3.0" data-composition-variables='[{"id": "cta", "type": "string", "label": "Chamada", "default": "Fale com a gente.", "maxLength": 32}, {"id": "button_label", "type": "string", "label": "Rótulo do botão", "default": "WhatsApp", "maxLength": 16}, {"id": "button_value", "type": "string", "label": "Contato", "default": "(00) 00000-0000", "maxLength": 24}, {"id": "meta", "type": "string", "label": "Linha de contato", "default": "Endereço · @perfil", "maxLength": 60}, {"id": "t_pulse", "type": "string", "label": "Tempo da respiração (s)", "default": "1.3"}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>CTA: título por letra + botão com mola e respiração</title>
  </head>
  <body>
    <template>
      <div id="cta-button-spring-root" data-composition-id="cta-button-spring" data-duration="3.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="cta-button-spring"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="cta-button-spring"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="cta-button-spring"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="cta-button-spring"] .tt { position: absolute; left: 80px; right: 80px; top: 700px; font-size: 150px; text-align: center; }
          [data-composition-id="cta-button-spring"] .btn { position: absolute; left: 50%; top: 1060px; transform: translateX(-50%); display: flex; gap: 22px; align-items: center; white-space: nowrap; padding: 30px 48px; border-radius: 999px; background: #1faa55; box-shadow: 0 20px 60px rgba(31,170,85,.45); font-size: 52px; font-weight: 800; }
          [data-composition-id="cta-button-spring"] .btn small { font-size: 30px; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
          [data-composition-id="cta-button-spring"] .meta { position: absolute; left: 80px; right: 80px; top: 1260px; text-align: center; font-size: 36px; color: #cfcfcf; font-weight: 600; }
        </style>
        <h2 class="tt anton"></h2><div class="bw"><div class="btn"><small class="bl"></small><span class="bv"></span></div></div><div class="meta"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"cta": "Fale com a gente.", "button_label": "WhatsApp", "button_value": "(00) 00000-0000", "meta": "Endereço · @perfil", "t_pulse": "1.3", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("cta-button-spring-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const ch = splitChars($(".tt"), V.cta); $(".bl").textContent = V.button_label; $(".bv").textContent = V.button_value; $(".meta").textContent = V.meta;
            tl.fromTo(ch, { yPercent: 120, opacity: 0, rotation: 10 }, { yPercent: 0, opacity: 1, rotation: 0, duration: 0.35, stagger: 0.025, ease: "back.out(2)" }, 0.1);
            tl.fromTo($(".tt"), { textShadow: RGB(18) }, { textShadow: RGB(0), duration: 0.5 }, 0.2);
            tl.fromTo($(".bw"), { scale: 0.4, opacity: 0, transformOrigin: "50% 1110px" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.5);
            tl.to($(".bw"), { scale: 1.06, duration: 0.25, repeat: 5, yoyo: true, ease: "sine.inOut" }, +V.t_pulse);
            tl.fromTo($(".meta"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.8);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["cta-button-spring"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
