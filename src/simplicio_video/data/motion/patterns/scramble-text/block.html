<!doctype html>
<!--
  simplicio-videos · motion/patterns/scramble-text/block.html — Texto que decodifica (scramble com semente)
  Linha monoespaçada embaralha caracteres a cada 2 frames e trava letra a letra da esquerda para a direita, com brilho no instante do travamento. Semente fixa = sempre igual.
  HyperFrames block (sub-composition), 1080x1920, 2.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/scramble-text.html and add
    <div id="..." class="clip" data-composition-id="scramble-text" data-composition-src="compositions/scramble-text.html"
         data-start="T" data-duration="2.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "scramble-text" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="scramble-text"].
  Técnica do card 'scramble' do video-shotcraft, reimplementada (glifos pré-sorteados com rng semeado, não Math.random).
-->
<html lang="pt-BR" data-composition-id="scramble-text" data-composition-duration="2.0" data-composition-variables='[{"id": "text", "type": "string", "label": "Texto final", "default": "SISTEMA PRONTO", "maxLength": 18}, {"id": "seed", "type": "number", "label": "Semente", "default": 11}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Texto que decodifica (scramble com semente)</title>
  </head>
  <body>
    <template>
      <div id="scramble-text-root" data-composition-id="scramble-text" data-duration="2.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="scramble-text"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="scramble-text"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="scramble-text"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="scramble-text"] .sc { position: absolute; left: 60px; right: 60px; top: 820px; text-align: center; font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 96px; font-weight: 700; white-space: nowrap; }
          [data-composition-id="scramble-text"] .sc span { display: inline-block; width: .62em; }
          [data-composition-id="scramble-text"] .sc span.on { color: #fff; } [data-composition-id="scramble-text"] .sc span.off { color: var(--secondary); opacity: .75; }
        </style>
        <div class="sc"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"text": "SISTEMA PRONTO", "seed": 11, "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("scramble-text-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const txt = String(V.text), R = rng(+V.seed), G = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>";
            const cells = [...txt].map((c) => { const s = document.createElement("span"); s.textContent = c === " " ? "\u00a0" : c; $(".sc").appendChild(s); return s; });
            const F = 1 / 30, lockAt = (i) => 0.3 + i * 0.07;
            // precompute every frame's glyph (seeded) so any seek shows the same text
            cells.forEach((s, i) => { const c = txt[i]; if (c === " ") return; const L = lockAt(i);
              for (let t = 0; t < L; t += 2 * F) { const g = G[Math.floor(R() * G.length)]; tl.call(() => { s.textContent = g; s.className = "off"; }, null, +t.toFixed(4)); }
              tl.call(() => { s.textContent = c; s.className = "on"; }, null, L);
              tl.fromTo(s, { textShadow: "0 0 0px rgba(255,255,255,0)" }, { textShadow: "0 0 24px rgba(160,200,255,.9)", duration: 0.06, yoyo: true, repeat: 1, immediateRender: false }, L); });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scramble-text"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
