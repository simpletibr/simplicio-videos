<!doctype html>
<!--
  simplicio-videos · motion/patterns/hud-scan-photo/block.html — HUD de mira + barra de scan + parallax de foto
  Foto em parallax lento, cantoneiras de HUD entram com scale, etiqueta pisca e uma barra de scan atravessa a tela — leitura 'diagnóstico/técnico'.
  HyperFrames block (sub-composition), 1080x1920, 2.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/hud-scan-photo.html and add
    <div id="..." class="clip" data-composition-id="hud-scan-photo" data-composition-src="compositions/hud-scan-photo.html"
         data-start="T" data-duration="2.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "hud-scan-photo" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="hud-scan-photo"].
  Extraído do showreel piloto de assistência técnica (cena S4).
-->
<html lang="pt-BR" data-composition-id="hud-scan-photo" data-composition-duration="2.5" data-composition-variables='[{"id": "image", "type": "string", "label": "Imagem", "default": "assets/placeholder-photo.svg"}, {"id": "label", "type": "string", "label": "Etiqueta", "default": "Diagnóstico técnico", "maxLength": 28}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>HUD de mira + barra de scan + parallax de foto</title>
  </head>
  <body>
    <template>
      <div id="hud-scan-photo-root" data-composition-id="hud-scan-photo" data-duration="2.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="hud-scan-photo"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="hud-scan-photo"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="hud-scan-photo"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="hud-scan-photo"] .ph { position: absolute; inset: 0; overflow: hidden; }
          [data-composition-id="hud-scan-photo"] .ph img { position: absolute; left: -5%; top: -5%; width: 110%; height: 110%; object-fit: cover; filter: saturate(.9) brightness(.7); }
          [data-composition-id="hud-scan-photo"] .hud { position: absolute; left: 140px; right: 140px; top: 560px; height: 800px; }
          [data-composition-id="hud-scan-photo"] .hud i { position: absolute; width: 120px; height: 120px; border: 0 solid var(--secondary); }
          [data-composition-id="hud-scan-photo"] .hud i:nth-child(1) { left: 0; top: 0; border-width: 10px 0 0 10px; } [data-composition-id="hud-scan-photo"] .hud i:nth-child(2) { right: 0; top: 0; border-width: 10px 10px 0 0; }
          [data-composition-id="hud-scan-photo"] .hud i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 10px 10px; } [data-composition-id="hud-scan-photo"] .hud i:nth-child(4) { right: 0; bottom: 0; border-width: 0 10px 10px 0; }
          [data-composition-id="hud-scan-photo"] .tag { position: absolute; left: 140px; top: 470px; font-size: 38px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--secondary); padding: 10px 20px; }
          [data-composition-id="hud-scan-photo"] .scan { position: absolute; left: 0; right: 0; top: -120px; height: 90px; background: linear-gradient(rgba(255,255,255,0), rgba(120,170,255,.45), rgba(255,255,255,0)); }
        </style>
        <div class="ph"><img class="img" alt="" /></div><div class="hud"><i></i><i></i><i></i><i></i></div><div class="tag"></div><div class="scan"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"image": "assets/placeholder-photo.svg", "label": "Diagnóstico técnico", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("hud-scan-photo-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".img").src = V.image; $(".tag").textContent = V.label;
            tl.fromTo($(".img"), { scale: 1.2, y: 60 }, { scale: 1.02, y: -60, duration: 2.5, ease: "none" }, 0);
            tl.fromTo($(".hud"), { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.05);
            tl.fromTo($(".tag"), { opacity: 0 }, { opacity: 1, duration: 0.05, repeat: 3, yoyo: true, ease: "none" }, 0.2);
            tl.set($(".tag"), { opacity: 1 }, 0.45);
            tl.fromTo($(".scan"), { y: 0 }, { y: 2200, duration: 1.1, ease: "power1.inOut" }, 0.1);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["hud-scan-photo"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
