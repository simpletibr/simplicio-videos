<!doctype html>
<!--
  simplicio-videos · motion/patterns/transition-glitch-rgb/block.html — Transição glitch (fatias RGB + flash + tranco)
  Fatias coloridas (semente fixa) cruzam a tela em sentidos alternados, flash branco e tranco horizontal de câmera; troca do painel A para o B no meio.
  HyperFrames block (sub-composition), 1080x1920, 1.2s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/transition-glitch-rgb.html and add
    <div id="..." class="clip" data-composition-id="transition-glitch-rgb" data-composition-src="compositions/transition-glitch-rgb.html"
         data-start="T" data-duration="1.2" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "transition-glitch-rgb" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="transition-glitch-rgb"].
  Extraído do showreel piloto de assistência técnica (glitchAt entre cenas).
-->
<html lang="pt-BR" data-composition-id="transition-glitch-rgb" data-composition-duration="1.2" data-composition-variables='[{"id": "label_a", "type": "string", "label": "Texto cena A", "default": "Cena A", "maxLength": 12}, {"id": "label_b", "type": "string", "label": "Texto cena B", "default": "Cena B", "maxLength": 12}, {"id": "seed", "type": "number", "label": "Semente", "default": 3}, {"id": "strong", "type": "boolean", "label": "Forte", "default": true}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Transição glitch (fatias RGB + flash + tranco)</title>
  </head>
  <body>
    <template>
      <div id="transition-glitch-rgb-root" data-composition-id="transition-glitch-rgb" data-duration="1.2" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="transition-glitch-rgb"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="transition-glitch-rgb"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="transition-glitch-rgb"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="transition-glitch-rgb"] .cam { position: absolute; inset: 0; }
          [data-composition-id="transition-glitch-rgb"] .pa, [data-composition-id="transition-glitch-rgb"] .pb { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Anton", sans-serif; font-size: 220px; text-transform: uppercase; }
          [data-composition-id="transition-glitch-rgb"] .pb { color: var(--primary); opacity: 0; }
          [data-composition-id="transition-glitch-rgb"] .slice { position: absolute; left: 0; width: 100%; opacity: 0; mix-blend-mode: screen; }
          [data-composition-id="transition-glitch-rgb"] .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
        </style>
        <div class="cam"><div class="pa"></div><div class="pb"></div></div><div class="fx"></div><div class="flash"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"label_a": "Cena A", "label_b": "Cena B", "seed": 3, "strong": true, "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("transition-glitch-rgb-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".pa").textContent = V.label_a; $(".pb").textContent = V.label_b;
            const R = rng(+V.seed), strong = V.strong !== false, sl = [];
            for (let i = 0; i < 9; i++) { const s = document.createElement("div"); s.className = "slice"; s.style.top = (R() * 1800).toFixed(0) + "px"; s.style.height = (40 + R() * 160).toFixed(0) + "px";
              s.style.background = i % 3 === 0 ? V.primary : i % 3 === 1 ? V.secondary : "#ffffff"; $(".fx").appendChild(s); sl.push(s); }
            const t = 0.3;
            sl.forEach((s, i) => { tl.fromTo(s, { opacity: 0, x: (i % 2 ? -1 : 1) * 1080 }, { opacity: strong ? 0.9 : 0.7, x: (i % 2 ? 1 : -1) * 120, duration: 0.1, ease: "power4.out", immediateRender: false }, t + i * 0.01);
              tl.to(s, { opacity: 0, x: (i % 2 ? 1 : -1) * 1080, duration: 0.12, ease: "power4.in" }, t + 0.14 + i * 0.01); });
            tl.fromTo($(".flash"), { opacity: 0 }, { opacity: strong ? 0.8 : 0.35, duration: 0.05, immediateRender: false }, t + 0.1);
            tl.to($(".flash"), { opacity: 0, duration: 0.2 }, t + 0.16);
            tl.fromTo($(".cam"), { x: 0 }, { x: 26, duration: 0.03, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, t + 0.05);
            tl.set($(".pa"), { opacity: 0 }, t + 0.12); tl.set($(".pb"), { opacity: 1 }, t + 0.12);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["transition-glitch-rgb"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
