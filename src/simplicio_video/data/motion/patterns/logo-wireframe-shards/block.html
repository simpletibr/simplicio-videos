<!doctype html>
<!--
  simplicio-videos · motion/patterns/logo-wireframe-shards/block.html — Logo: wireframe → estilhaços que montam → nome digitado
  Contorno do logo é desenhado em linha, estilhaços triangulares (semente fixa) voam e se encaixam, o logo real aparece e o nome da marca é digitado abaixo.
  HyperFrames block (sub-composition), 1080x1920, 3.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/logo-wireframe-shards.html and add
    <div id="..." class="clip" data-composition-id="logo-wireframe-shards" data-composition-src="compositions/logo-wireframe-shards.html"
         data-start="T" data-duration="3.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "logo-wireframe-shards" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="logo-wireframe-shards"].
  Técnica destilada do prompt de @Mounnna no awesome-opus5-5-videos ('draw the logo as a wireframe first, then fly in faceted low-poly shards ... typing out the brand name'), reimplementada.
-->
<html lang="pt-BR" data-composition-id="logo-wireframe-shards" data-composition-duration="3.5" data-composition-variables='[{"id": "logo", "type": "string", "label": "Logo (PNG/SVG)", "default": "assets/placeholder-logo.svg"}, {"id": "name", "type": "string", "label": "Nome da marca", "default": "Sua Marca", "maxLength": 24}, {"id": "seed", "type": "number", "label": "Semente", "default": 5}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Logo: wireframe → estilhaços que montam → nome digitado</title>
  </head>
  <body>
    <template>
      <div id="logo-wireframe-shards-root" data-composition-id="logo-wireframe-shards" data-duration="3.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="logo-wireframe-shards"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="logo-wireframe-shards"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="logo-wireframe-shards"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="logo-wireframe-shards"] .wrap { position: absolute; left: 50%; top: 40%; width: 520px; height: 520px; margin: -260px 0 0 -260px; }
          [data-composition-id="logo-wireframe-shards"] .wrap svg { position: absolute; inset: 0; overflow: visible; }
          [data-composition-id="logo-wireframe-shards"] .wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
          [data-composition-id="logo-wireframe-shards"] .nm { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; font-size: 84px; font-weight: 900; letter-spacing: -0.02em; white-space: pre; }
          [data-composition-id="logo-wireframe-shards"] .cur { display: inline-block; width: 6px; height: 80px; background: var(--primary); vertical-align: -10px; margin-left: 6px; }
        </style>
        <div class="wrap"><svg viewBox="0 0 520 520"><circle class="wf" cx="260" cy="260" r="250" fill="none" stroke="var(--secondary)" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><g class="shards"></g></svg><img class="logo" alt="" /></div><div class="nm"><span class="t"></span><span class="cur"></span></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"logo": "assets/placeholder-logo.svg", "name": "Sua Marca", "seed": 5, "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("logo-wireframe-shards-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".logo").src = V.logo;
            const R = rng(+V.seed), NS = "http://www.w3.org/2000/svg", g = $(".shards"), sh = [];
            for (let i = 0; i < 18; i++) { const a0 = (i / 18) * Math.PI * 2, a1 = ((i + 1) / 18) * Math.PI * 2, r = 250;
              const p = document.createElementNS(NS, "path"); p.setAttribute("d", `M260 260 L${260 + Math.cos(a0) * r} ${260 + Math.sin(a0) * r} L${260 + Math.cos(a1) * r} ${260 + Math.sin(a1) * r} Z`);
              p.setAttribute("fill", i % 3 ? V.secondary : V.primary); p.setAttribute("opacity", (0.35 + R() * 0.5).toFixed(2)); g.appendChild(p); sh.push([p, a0 + Math.PI / 18]); }
            tl.fromTo($(".wf"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 0.1);
            sh.forEach(([p, a], i) => tl.fromTo(p, { x: Math.cos(a) * (500 + R() * 300), y: Math.sin(a) * (500 + R() * 300), rotation: (R() - 0.5) * 180, opacity: 0, svgOrigin: "260 260" },
              { x: 0, y: 0, rotation: 0, opacity: 0.8, duration: 0.55, ease: "power3.out", immediateRender: false }, 0.6 + i * 0.03));
            tl.to(g, { opacity: 0, duration: 0.25 }, 1.55); tl.to($(".wf"), { opacity: 0, duration: 0.25 }, 1.55);
            tl.fromTo($(".logo"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.5);
            const name = String(V.name), t0 = 2.0;
            for (let k = 0; k <= name.length; k++) tl.call(() => { $(".t").textContent = name.slice(0, k); }, null, +(t0 + k * 0.05).toFixed(3));
            tl.set($(".t"), { textContent: "" }, 0);
            tl.fromTo($(".cur"), { opacity: 1 }, { opacity: 0, duration: 0.2, repeat: 5, yoyo: true, ease: "steps(1)" }, t0 + name.length * 0.05);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["logo-wireframe-shards"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
