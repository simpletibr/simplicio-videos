<!doctype html>
<!--
  simplicio-videos · motion/patterns/item-relay-counter/block.html — Revezamento de itens com contador + barra segmentada
  Itens grandes entram um de cada vez (skew + split RGB) no tempo em que são falados, com contador 01/03 e barra segmentada que preenche.
  HyperFrames block (sub-composition), 1080x1920, 3.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/item-relay-counter.html and add
    <div id="..." class="clip" data-composition-id="item-relay-counter" data-composition-src="compositions/item-relay-counter.html"
         data-start="T" data-duration="3.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "item-relay-counter" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="item-relay-counter"].
  Extraído do showreel piloto de assistência técnica (cena S3).
-->
<html lang="pt-BR" data-composition-id="item-relay-counter" data-composition-duration="3.0" data-composition-variables='[{"id": "kicker", "type": "string", "label": "Kicker", "default": "Problemas que resolvemos", "maxLength": 32}, {"id": "items", "type": "string", "label": "Itens (separados por |)", "default": "Item um|Item dois|Item três"}, {"id": "times", "type": "string", "label": "Tempos de entrada (s, separados por |)", "default": "0.3|1.2|2.1"}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Revezamento de itens com contador + barra segmentada</title>
  </head>
  <body>
    <template>
      <div id="item-relay-counter-root" data-composition-id="item-relay-counter" data-duration="3.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="item-relay-counter"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="item-relay-counter"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="item-relay-counter"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="item-relay-counter"] .kick { position: absolute; left: 80px; top: 300px; font-size: 40px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--secondary); }
          [data-composition-id="item-relay-counter"] .count { position: absolute; left: 80px; top: 360px; font-size: 40px; font-weight: 800; color: var(--primary); }
          [data-composition-id="item-relay-counter"] .count span { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; }
          [data-composition-id="item-relay-counter"] .it { position: absolute; left: 80px; right: 80px; top: 470px; font-size: 170px; opacity: 0; }
          [data-composition-id="item-relay-counter"] .bar { position: absolute; left: 80px; right: 80px; top: 900px; display: flex; gap: 14px; }
          [data-composition-id="item-relay-counter"] .bar i { flex: 1; height: 12px; background: rgba(255,255,255,.14); position: relative; }
          [data-composition-id="item-relay-counter"] .bar i b { position: absolute; inset: 0; background: var(--primary); transform-origin: left; transform: scaleX(0); }
        </style>
        <div class="kick"></div><div class="count"></div><div class="items"></div><div class="bar"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"kicker": "Problemas que resolvemos", "items": "Item um|Item dois|Item três", "times": "0.3|1.2|2.1", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("item-relay-counter-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".kick").textContent = V.kicker;
            const items = list(V.items), times = list(V.times).map(Number), n = items.length;
            items.forEach((txt, i) => {
              const el = document.createElement("h2"); el.className = "it anton"; el.textContent = txt; $(".items").appendChild(el);
              const longest = Math.max(...txt.split(" ").map((w) => w.length)); el.style.fontSize = Math.min(170, Math.floor(920 / (0.47 * longest))) + "px";
              const c = document.createElement("span"); c.textContent = String(i + 1).padStart(2, "0") + " / " + String(n).padStart(2, "0"); $(".count").appendChild(c);
              const seg = document.createElement("i"); seg.appendChild(document.createElement("b")); $(".bar").appendChild(seg);
            });
            const its = $$(".it"), cs = $$(".count span"), segs = $$(".bar b");
            tl.fromTo($(".kick"), { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0);
            times.forEach((t, i) => {
              tl.fromTo(its[i], { opacity: 0, yPercent: 60, skewY: 6, scale: 1.25 }, { opacity: 1, yPercent: 0, skewY: 0, scale: 1, duration: 0.25, ease: "power4.out", immediateRender: false }, t);
              tl.fromTo(its[i], { textShadow: RGB(14) }, { textShadow: RGB(0), duration: 0.3, immediateRender: false }, t);
              if (i < n - 1) tl.to(its[i], { opacity: 0, yPercent: -70, duration: 0.16, ease: "power3.in" }, times[i + 1] - 0.16);
              tl.fromTo(segs[i], { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, t);
              tl.set(cs[i], { opacity: 1 }, t); if (i < n - 1) tl.set(cs[i], { opacity: 0 }, times[i + 1]);
            });
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["item-relay-counter"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
