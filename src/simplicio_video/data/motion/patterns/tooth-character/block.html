<html lang="pt-BR" data-composition-id="tooth-character" data-composition-duration="4.0" data-composition-variables='[{"id": "x", "type": "number", "label": "Centro x (px)", "default": 540}, {"id": "y", "type": "number", "label": "Centro y (px)", "default": 1060}, {"id": "scale", "type": "number", "label": "Escala", "default": 1.3}, {"id": "body", "type": "color", "label": "Cor do dente", "default": "#ffffff"}, {"id": "ink", "type": "color", "label": "Contorno", "default": "#3d3834"}, {"id": "cheek", "type": "color", "label": "Bochechas", "default": "#ffb3b3"}, {"id": "accent", "type": "color", "label": "Brilho/estrela", "default": "#ffd23f"}, {"id": "t_in", "type": "number", "label": "Entrada (s)", "default": 0.1}, {"id": "wave_t", "type": "number", "label": "Aceno começa (s)", "default": 0.7}, {"id": "label", "type": "string", "label": "Balão de fala (vazio = sem balão)", "default": "Oi!", "maxLength": 18}, {"id": "dur", "type": "number", "label": "Duração (s) = data-duration do host", "default": 4.0}, {"id": "bpm", "type": "number", "label": "BPM: dança com squash & stretch em cada batida (0 = quique suave)", "default": 0}, {"id": "beat0", "type": "number", "label": "Primeira batida (s, no bloco)", "default": 0}, {"id": "bg", "type": "string", "label": "Fundo", "default": "#fbf7f2"}, {"id": "seed", "type": "number", "label": "Semente", "default": 3}]'>

        <script>

            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};

            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";

            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);

            $(".tooth").setAttribute("fill", V.body); $(".mouth").setAttribute("fill", V.ink);

            tl.fromTo(w, { scale: 0, y: V.y - 35 }, { scale: V.scale, y: V.y - 235, duration: 0.7, ease: "back.out(2.2)" }, V.t_in);

                tl.to(sv, { scaleX: 0.92, scaleY: 1.1, rotation: k % 2 ? 5 : -5, duration: B * 0.35, ease: "power2.out" }, t + 0.06);

                tl.to(sv, { scaleX: 1, scaleY: 1, duration: B * 0.3, ease: "sine.inOut" }, t + 0.06 + B * 0.35); }
            } else {
              const bob = 0.5, reps = Math.max(1, Math.floor((V.dur - V.t_in - 0.8) / bob));
              tl.fromTo(w, { y: V.y - 235 }, { y: V.y - 265, duration: bob / 2, yoyo: true, repeat: reps * 2 - 1, ease: "sine.inOut", immediateRender: false }, V.t_in + 0.8);
            }
            tl.fromTo(".armR", { rotation: 0 }, { rotation: -32, duration: 0.18, yoyo: true, repeat: 7, ease: "sine.inOut", svgOrigin: "322 240" }, V.wave_t);
            tl.fromTo(".armL", { rotation: 0 }, { rotation: 10, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut", svgOrigin: "78 240" }, V.wave_t + 0.2);
