<!doctype html>
<!--
  simplicio-videos · motion/patterns/portrait-board-close/block.html — Fecho: retrato + prancha + chamada
  Retrato em cartão arredondado, prancha inclinada sobreposta no canto e, embaixo, a chamada com @perfil e site — último quadro de consultoria/portfólio.
  HyperFrames block (sub-composition), 1080x1920, 3.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/portrait-board-close.html and add
    <div id="..." class="clip" data-composition-id="portrait-board-close" data-composition-src="compositions/portrait-board-close.html"
         data-start="T" data-duration="3.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "portrait-board-close" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="portrait-board-close"].
-->
<html lang="pt-BR" data-composition-id="portrait-board-close" data-composition-duration="3.5" data-composition-variables='[{"id": "portrait", "type": "string", "label": "Retrato", "default": "assets/placeholder-photo.svg"}, {"id": "board", "type": "string", "label": "Prancha", "default": "assets/placeholder-photo.svg"}, {"id": "focus_y", "type": "number", "label": "Foco vertical do retrato (0-1)", "default": 0.3}, {"id": "focus_x", "type": "number", "label": "Foco horizontal do retrato (0-1)", "default": 0.6}, {"id": "kicker", "type": "string", "label": "Linha pequena", "default": "consultoria de imagem", "maxLength": 32}, {"id": "cta", "type": "string", "label": "Chamada", "default": "Peça a sua consultoria de imagem", "maxLength": 60}, {"id": "handle", "type": "string", "label": "@perfil", "default": "@perfil", "maxLength": 28}, {"id": "site", "type": "string", "label": "Site (vazio oculta)", "default": "", "maxLength": 32}, {"id": "ink", "type": "color", "label": "Texto", "default": "#2a221d"}, {"id": "accent", "type": "color", "label": "Destaque", "default": "#a8825a"}, {"id": "bg", "type": "color", "label": "Fundo", "default": "#efe9e1"}, {"id": "dur", "type": "number", "label": "Duração (s)", "default": 3.5}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Fecho: retrato + prancha + chamada</title>
  </head>
  <body>
    <template>
      <div id="portrait-board-close-root" data-composition-id="portrait-board-close" data-duration="3.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="portrait-board-close"] { position: absolute; inset: 0; overflow: hidden; color: var(--ink); font-family: "Inter", sans-serif; background: var(--bg); }
          [data-composition-id="portrait-board-close"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="portrait-board-close"] .portrait { position: absolute; left: 60px; top: 130px; width: 620px; height: 1060px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 70px rgba(42,34,29,.28); }
          [data-composition-id="portrait-board-close"] .portrait img { width: 100%; height: 100%; object-fit: cover; }
          [data-composition-id="portrait-board-close"] .board { position: absolute; left: 520px; top: 640px; width: 480px; height: 660px; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 34px 80px rgba(42,34,29,.4); transform: rotate(4deg); }
          [data-composition-id="portrait-board-close"] .board img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
          [data-composition-id="portrait-board-close"] .kick { position: absolute; left: 70px; right: 70px; top: 1490px; font-size: 36px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
          [data-composition-id="portrait-board-close"] .cta { position: absolute; left: 70px; right: 70px; top: 1548px; font-size: 76px; font-weight: 800; line-height: 1.06; letter-spacing: -.02em; text-wrap: balance; }
          [data-composition-id="portrait-board-close"] .pill { position: absolute; left: 70px; top: 1760px; display: flex; gap: 18px; align-items: center; font-size: 44px; font-weight: 700; }
          [data-composition-id="portrait-board-close"] .pill span { background: var(--ink); color: var(--bg); padding: 14px 30px; border-radius: 999px; }
          [data-composition-id="portrait-board-close"] .pill .site { background: transparent; color: var(--ink); padding: 0; opacity: .75; }
          [data-composition-id="portrait-board-close"] .empty { display: none; }
        </style>
        <div class="portrait"><img class="pimg" alt="" /></div><div class="board"><img class="bimg" alt="" /></div>
        <div class="kick"></div><div class="cta"></div><div class="pill"><span class="handle"></span><span class="site"></span></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"portrait": "assets/placeholder-photo.svg", "board": "assets/placeholder-photo.svg", "focus_y": 0.3, "focus_x": 0.6, "kicker": "consultoria de imagem", "cta": "Peça a sua consultoria de imagem", "handle": "@perfil", "site": "", "ink": "#2a221d", "accent": "#a8825a", "bg": "#efe9e1", "dur": 3.5};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("portrait-board-close-root");
            const $ = (s) => root.querySelector(s);
            const num = (x, d) => (Number.isFinite(Number(x)) ? Number(x) : d);
            const tl = gsap.timeline({ paused: true });
            root.style.setProperty("--ink", V.ink); root.style.setProperty("--accent", V.accent); root.style.setProperty("--bg", V.bg);
            $(".pimg").src = V.portrait; $(".pimg").style.objectPosition = num(V.focus_x, 0.6) * 100 + "% " + num(V.focus_y, 0.3) * 100 + "%"; $(".bimg").src = V.board;
            $(".kick").textContent = V.kicker; $(".cta").textContent = V.cta; $(".handle").textContent = V.handle;
            const site = $(".site"); site.textContent = V.site || ""; if (!V.site) site.classList.add("empty");
            tl.fromTo($(".portrait"), { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 0);
            tl.fromTo($(".board"), { opacity: 0, x: 140, rotation: 10 }, { opacity: 1, x: 0, rotation: 4, duration: 0.6, ease: "back.out(1.3)" }, 0.25);
            tl.fromTo([$(".kick"), $(".cta"), $(".pill")], { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, 0.7);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["portrait-board-close"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
