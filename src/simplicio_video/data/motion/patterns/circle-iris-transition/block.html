<!doctype html>
<!--
  simplicio-videos · motion/patterns/circle-iris-transition/block.html — Transição íris circular (match cut)
  Um círculo nasce do centro de um elemento redondo da cena A e se expande revelando a cena B, cujo elemento principal também é circular — o corte ganha âncora visual.
  HyperFrames block (sub-composition), 1080x1920, 1.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/circle-iris-transition.html and add
    <div id="..." class="clip" data-composition-id="circle-iris-transition" data-composition-src="compositions/circle-iris-transition.html"
         data-start="T" data-duration="1.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "circle-iris-transition" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="circle-iris-transition"].
  Técnica do card 'circle-match-iris' do video-shotcraft, reimplementada.
-->
<html lang="pt-BR" data-composition-id="circle-iris-transition" data-composition-duration="1.5" data-composition-variables='[{"id": "label_a", "type": "string", "label": "Texto cena A", "default": "Antes", "maxLength": 12}, {"id": "label_b", "type": "string", "label": "Texto cena B", "default": "Depois", "maxLength": 12}, {"id": "cx", "type": "number", "label": "Centro X (px)", "default": 540}, {"id": "cy", "type": "number", "label": "Centro Y (px)", "default": 900}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Transição íris circular (match cut)</title>
  </head>
  <body>
    <template>
      <div id="circle-iris-transition-root" data-composition-id="circle-iris-transition" data-duration="1.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="circle-iris-transition"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="circle-iris-transition"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="circle-iris-transition"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="circle-iris-transition"] .sa, [data-composition-id="circle-iris-transition"] .sb { position: absolute; inset: 0; }
          [data-composition-id="circle-iris-transition"] .sa { background: #0b0b0e; } [data-composition-id="circle-iris-transition"] .sb { background: var(--primary); }
          [data-composition-id="circle-iris-transition"] .dot { position: absolute; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; }
          [data-composition-id="circle-iris-transition"] .sa .dot { background: #fff; } [data-composition-id="circle-iris-transition"] .sb .dot { background: #0b0b0e; }
          [data-composition-id="circle-iris-transition"] .lbl { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; font-family: "Anton", sans-serif; font-size: 170px; text-transform: uppercase; }
          [data-composition-id="circle-iris-transition"] .sb .lbl { color: #0b0b0e; }
        </style>
        <div class="sa"><div class="dot"></div><div class="lbl la"></div></div><div class="sb"><div class="dot"></div><div class="lbl lb"></div></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"label_a": "Antes", "label_b": "Depois", "cx": 540, "cy": 900, "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("circle-iris-transition-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".la").textContent = V.label_a; $(".lb").textContent = V.label_b;
            $$(".dot").forEach((d) => { d.style.left = V.cx + "px"; d.style.top = V.cy + "px"; });
            const R0 = 130, R1 = Math.hypot(Math.max(V.cx, 1080 - V.cx), Math.max(V.cy, 1920 - V.cy));
            tl.fromTo($(".sa .dot"), { scale: 0.7 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0);
            tl.fromTo($(".sb"), { clipPath: `circle(0px at ${V.cx}px ${V.cy}px)` }, { clipPath: `circle(${R0}px at ${V.cx}px ${V.cy}px)`, duration: 0.2, ease: "power2.in" }, 0.45);
            tl.to($(".sb"), { clipPath: `circle(${R1 + 40}px at ${V.cx}px ${V.cy}px)`, duration: 0.45, ease: "power3.inOut" }, 0.65);
            tl.fromTo($(".sb .dot"), { scale: 1.6 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0.65);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["circle-iris-transition"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
