<!doctype html>
<!--
  simplicio-videos · motion/patterns/kinetic-bounce-title/block.html — Título com letras quicando (infantil)
  Até 3 linhas; cada letra salta da própria linha (pop + pulo + quique bounce.out, sem cruzar outras linhas), achata de leve ao pousar; cores alternadas da paleta; onda suave depois do pouso e saída em pop.
  HyperFrames block (sub-composition), 1080x1920, 3.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/kinetic-bounce-title.html and add
    <div id="..." class="clip" data-composition-id="kinetic-bounce-title" data-composition-src="compositions/kinetic-bounce-title.html"
         data-start="T" data-duration="3.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "kinetic-bounce-title" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="kinetic-bounce-title"].
  Origin: authored for the kids/dental template (pediatric dentistry, Dia das Criancas 2026).
-->
<html lang="pt-BR" data-composition-id="kinetic-bounce-title" data-composition-duration="3.0" data-composition-variables='[{"id": "line1", "type": "string", "label": "Linha 1", "default": "Feliz", "maxLength": 14}, {"id": "line2", "type": "string", "label": "Linha 2", "default": "Dia das", "maxLength": 14}, {"id": "line3", "type": "string", "label": "Linha 3", "default": "Crianças!", "maxLength": 14}, {"id": "colors", "type": "string", "label": "Paleta (hex separados por |)", "default": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb"}, {"id": "ink", "type": "color", "label": "Cor da sombra/contorno", "default": "#3d3834"}, {"id": "size", "type": "number", "label": "Tamanho da fonte (px)", "default": 170}, {"id": "y", "type": "number", "label": "Topo do bloco de texto (px)", "default": 560}, {"id": "t0", "type": "number", "label": "Início (s)", "default": 0.15}, {"id": "stagger", "type": "number", "label": "Atraso entre letras (s)", "default": 0.045}, {"id": "exit", "type": "boolean", "label": "Sair em pop no fim", "default": true}, {"id": "dur", "type": "number", "label": "Duração (s) = data-duration do host (saída em pop 0,3 s antes)", "default": 3.0}, {"id": "bg", "type": "string", "label": "Fundo (cor CSS ou transparent)", "default": "#fbf7f2"}, {"id": "seed", "type": "number", "label": "Semente", "default": 5}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Título com letras quicando (infantil)</title>
  </head>
  <body>
    <template>
      <div id="kinetic-bounce-title-root" data-composition-id="kinetic-bounce-title" data-duration="3.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
          [data-composition-id="kinetic-bounce-title"] { position: absolute; inset: 0; overflow: hidden; color: #3d3834; font-family: "Inter", sans-serif; background: var(--bg, transparent); }
          [data-composition-id="kinetic-bounce-title"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="kinetic-bounce-title"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="kinetic-bounce-title"] .title { position: absolute; left: 40px; right: 40px; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 700; line-height: 1.22; }
          [data-composition-id="kinetic-bounce-title"] .ln { display: block; white-space: nowrap; letter-spacing: 0.03em; }
          [data-composition-id="kinetic-bounce-title"] .ch { will-change: transform; }
        </style>
        <div class="title"><span class="ln" id="kbt-l1"></span><span class="ln" id="kbt-l2"></span><span class="ln" id="kbt-l3"></span></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"line1": "Feliz", "line2": "Dia das", "line3": "Crianças!", "colors": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb", "ink": "#3d3834", "size": 170, "y": 560, "t0": 0.15, "stagger": 0.045, "exit": true, "dur": 3.0, "bg": "#fbf7f2", "seed": 5};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("kinetic-bounce-title-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            root.style.setProperty("--bg", V.bg || "transparent");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const R = rng(V.seed), pal = list(V.colors);
            const title = $(".title"); title.style.top = V.y + "px"; title.style.fontSize = V.size + "px";
            title.style.textShadow = `0 ${Math.round(V.size * 0.06)}px 0 ${V.ink}22`;
            let chars = [];
            [V.line1, V.line2, V.line3].forEach((t, k) => { const el = $("#kbt-l" + (k + 1)); if (!t) { el.style.display = "none"; return; } chars = chars.concat(splitChars(el, t)); });
            chars.forEach((c, i) => { c.style.color = pal[i % pal.length]; c.style.webkitTextStroke = `${Math.max(2, Math.round(V.size / 40))}px ${V.ink}`; c.style.paintOrder = "stroke fill"; });
            chars.forEach((c, i) => {
              const at = V.t0 + i * V.stagger, rot = (R() - 0.5) * 30;
              // pop up from its own baseline (never crosses other lines), hop, land with a small squash
              tl.fromTo(c, { scale: 0, y: 0, rotation: rot, transformOrigin: "50% 100%" }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(3)" }, at);
              tl.to(c, { y: -Math.round(V.size * 0.28), duration: 0.16, ease: "power2.out" }, at + 0.08);
              tl.to(c, { y: 0, duration: 0.3, ease: "bounce.out" }, at + 0.24);
              tl.to(c, { scaleY: 0.9, duration: 0.06, ease: "power2.out" }, at + 0.33);
              tl.to(c, { scaleY: 1, duration: 0.3, ease: "elastic.out(1,0.4)" }, at + 0.39);
            });
            const land = V.t0 + chars.length * V.stagger + 0.7;
            chars.forEach((c, i) => tl.to(c, { y: -22, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, land + i * 0.03));
            if (V.exit) chars.forEach((c, i) => tl.to(c, { scale: 0, duration: 0.22, ease: "back.in(2)" }, V.dur - 0.3 + (i % 5) * 0.012));
            tl.set({}, {}, V.dur);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["kinetic-bounce-title"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
