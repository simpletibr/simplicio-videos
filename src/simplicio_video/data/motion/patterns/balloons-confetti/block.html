<!doctype html>
<!--
  simplicio-videos · motion/patterns/balloons-confetti/block.html — Balões subindo + explosão de confete
  Balões SVG (cores da paleta, semente fixa) sobem balançando; confete explode de um ponto e cai com giro. count=0 deixa só o confete.
  HyperFrames block (sub-composition), 1080x1920, 3.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/balloons-confetti.html and add
    <div id="..." class="clip" data-composition-id="balloons-confetti" data-composition-src="compositions/balloons-confetti.html"
         data-start="T" data-duration="3.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "balloons-confetti" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="balloons-confetti"].
  Origin: authored for the kids/dental template (pediatric dentistry, Dia das Criancas 2026).
-->
<html lang="pt-BR" data-composition-id="balloons-confetti" data-composition-duration="3.5" data-composition-variables='[{"id": "colors", "type": "string", "label": "Paleta (hex |)", "default": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb"}, {"id": "count", "type": "number", "label": "Nº de balões", "default": 9}, {"id": "rise_s", "type": "number", "label": "Tempo de subida (s)", "default": 3.2}, {"id": "t_burst", "type": "number", "label": "Explosão do confete (s)", "default": 0.35}, {"id": "burst_x", "type": "number", "label": "Confete: x (px)", "default": 540}, {"id": "burst_y", "type": "number", "label": "Confete: y (px)", "default": 820}, {"id": "confetti", "type": "number", "label": "Nº de confetes", "default": 70}, {"id": "ink", "type": "color", "label": "Cor do barbante", "default": "#3d3834"}, {"id": "bg", "type": "string", "label": "Fundo", "default": "#fbf7f2"}, {"id": "seed", "type": "number", "label": "Semente", "default": 11}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Balões subindo + explosão de confete</title>
  </head>
  <body>
    <template>
      <div id="balloons-confetti-root" data-composition-id="balloons-confetti" data-duration="3.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
          [data-composition-id="balloons-confetti"] { position: absolute; inset: 0; overflow: hidden; color: #3d3834; font-family: "Inter", sans-serif; background: var(--bg, transparent); }
          [data-composition-id="balloons-confetti"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="balloons-confetti"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="balloons-confetti"] .bl { position: absolute; left: 0; top: 0; }
          [data-composition-id="balloons-confetti"] .cf { position: absolute; left: 0; top: 0; border-radius: 3px; }
        </style>
        <div class="balloons"></div><div class="confetti"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"colors": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb", "count": 9, "rise_s": 3.2, "t_burst": 0.35, "burst_x": 540, "burst_y": 820, "confetti": 70, "ink": "#3d3834", "bg": "#fbf7f2", "seed": 11};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("balloons-confetti-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            root.style.setProperty("--bg", V.bg || "transparent");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const R = rng(V.seed), pal = list(V.colors), NS = "http://www.w3.org/2000/svg";
            const bx = $(".balloons"), cx = $(".confetti");
            for (let i = 0; i < V.count; i++) {
              const w = 150 + R() * 70, h = w * 1.22, col = pal[i % pal.length];
              const d = document.createElement("div"); d.className = "bl";
              d.innerHTML = `<svg width="${w}" height="${h + 260}" viewBox="0 0 ${w} ${h + 260}"><path d="M${w/2},${h+8} C${w/2-18},${h+80} ${w/2+18},${h+150} ${w/2},${h+255}" stroke="${V.ink}" stroke-opacity="0.55" stroke-width="3" fill="none"/>
                <path d="M${w/2-12},${h+10} L${w/2+12},${h+10} L${w/2},${h-6} Z" fill="${col}"/><ellipse cx="${w/2}" cy="${h/2}" rx="${w/2-3}" ry="${h/2-3}" fill="${col}"/>
                <ellipse cx="${w*0.34}" cy="${h*0.3}" rx="${w*0.1}" ry="${h*0.16}" fill="#fff" fill-opacity="0.45" transform="rotate(-20 ${w*0.34} ${h*0.3})"/></svg>`;
              bx.appendChild(d);
              const x0 = (i + 0.5) / V.count * 1080 - w / 2 + (R() - 0.5) * 80, dur = V.rise_s * (0.85 + R() * 0.3), dl = R() * 0.45;
              tl.fromTo(d, { x: x0, y: 1950 + R() * 250 }, { y: -h - 300, duration: dur, ease: "none" }, dl);
              const sway = 0.9 + R() * 0.5, reps = Math.max(1, Math.ceil((dur + dl) / sway));
              tl.fromTo(d, { rotation: -7 }, { rotation: 7, duration: sway / 2, yoyo: true, repeat: reps * 2 - 1, ease: "sine.inOut", transformOrigin: "50% 100%" }, 0);
            }
            for (let i = 0; i < V.confetti; i++) {
              const p = document.createElement("div"); p.className = "cf"; const s = 12 + R() * 14;
              p.style.width = s + "px"; p.style.height = (R() < 0.4 ? s : s * 1.8) + "px"; if (R() < 0.3) p.style.borderRadius = "50%";
              p.style.background = pal[i % pal.length]; cx.appendChild(p);
              const a = R() * Math.PI * 2, dist = 220 + R() * 520, tx = V.burst_x + Math.cos(a) * dist, ty = V.burst_y + Math.sin(a) * dist * 0.8 - 200;
              tl.fromTo(p, { x: V.burst_x, y: V.burst_y, rotation: 0, scale: 0.2, opacity: 1 }, { x: tx, y: ty, scale: 1, rotation: (R() - 0.5) * 540, duration: 0.6, ease: "power3.out" }, V.t_burst);
              tl.to(p, { y: ty + 700 + R() * 500, x: tx + (R() - 0.5) * 160, rotation: "+=" + Math.round((R() - 0.5) * 720), duration: 2.2, ease: "power1.in" }, V.t_burst + 0.6);
              tl.to(p, { opacity: 0, duration: 0.4 }, V.t_burst + 2.3);
            }
            tl.set({}, {}, 3.5);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["balloons-confetti"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
