<!doctype html>
<!--
  brand-promo: promo de marca de 3 cenas para qualquer setor (studio, #16). Composta ONLY com blocos de motion/patterns
  (kinetic-words, line-accent, brand-lockup-soft): params vêm do contrato (cenas[].motion[].params -> {{vars:<bloco>}}),
  tempos das cenas de cenas[].duracao_s. Sem fundo animado nem fx: nenhum mecanismo de render novo.
  Deterministic: no Math.random, Date.now, fetch or infinite repeats. Fatos só de brand.json (claim guard do studio).
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{width}}, height={{height}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{width}}px; height: {{height}}px; overflow: hidden; background: #fdf8f5; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duracao}}" data-width="{{width}}" data-height="{{height}}">
      <!-- S1 gancho -->
      <div id="s1-words" class="clip" data-composition-id="kinetic-words" data-composition-src="compositions/kinetic-words.html" data-start="{{t:s1}}" data-duration="{{dur:s1}}" data-track-index="1" data-variable-values='{{vars:s1-words}}'></div>

      <!-- S2 prova -->
      <div id="s2-accent" class="clip" data-composition-id="line-accent" data-composition-src="compositions/line-accent.html" data-start="{{t:s2}}" data-duration="{{dur:s2}}" data-track-index="1" data-variable-values='{{vars:s2-accent}}'></div>

      <!-- S3 marca -->
      <div id="s3-lockup" class="clip" data-composition-id="brand-lockup-soft" data-composition-src="compositions/brand-lockup-soft.html" data-start="{{t:s3}}" data-duration="{{dur:s3}}" data-track-index="1" data-variable-values='{{vars:s3-lockup}}'></div>

      <audio id="soundtrack" src="assets/audio/build/mix.wav" data-start="0" data-duration="{{duracao}}" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, {{duracao}});
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
