<!doctype html>
<!--
  simplicio-videos · motion/patterns/cliptitle-chip-cascade/block.html — Título por clip-path + cascata de chips
  Duas metades do título abrem por clip-path em direções opostas (com split RGB) e uma grade de chips cai em cascata alternando os lados.
  HyperFrames block (sub-composition), 1080x1920, 2.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/cliptitle-chip-cascade.html and add
    <div id="..." class="clip" data-composition-id="cliptitle-chip-cascade" data-composition-src="compositions/cliptitle-chip-cascade.html"
         data-start="T" data-duration="2.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "cliptitle-chip-cascade" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="cliptitle-chip-cascade"].
  Extraído de clients/wjr-informatica-games/video-01 (cena S4).
-->
<html lang="pt-BR" data-composition-id="cliptitle-chip-cascade" data-composition-duration="2.5" data-composition-variables='[{"id": "title1", "type": "string", "label": "Título linha 1", "default": "Atendemos", "maxLength": 16}, {"id": "title2", "type": "string", "label": "Título linha 2", "default": "todas as marcas", "maxLength": 18}, {"id": "chips", "type": "string", "label": "Chips (separados por |)", "default": "Marca A|Marca B|Marca C|Marca D|Marca E|Marca F"}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Título por clip-path + cascata de chips</title>
  </head>
  <body>
    <template>
      <div id="cliptitle-chip-cascade-root" data-composition-id="cliptitle-chip-cascade" data-duration="2.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="cliptitle-chip-cascade"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="cliptitle-chip-cascade"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="cliptitle-chip-cascade"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="cliptitle-chip-cascade"] .t { position: absolute; left: 80px; right: 80px; top: 520px; font-size: 150px; }
          [data-composition-id="cliptitle-chip-cascade"] .t .t2 { color: var(--primary); display: block; }
          [data-composition-id="cliptitle-chip-cascade"] .chips { position: absolute; left: 80px; right: 80px; top: 1060px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
          [data-composition-id="cliptitle-chip-cascade"] .chip { font-size: 44px; font-weight: 700; padding: 22px 28px; border-radius: 18px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.14); }
          [data-composition-id="cliptitle-chip-cascade"] .chip:nth-child(even) { border-color: var(--primary); }
        </style>
        <h2 class="t anton"><span class="t1"></span><span class="t2"></span></h2><div class="chips"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"title1": "Atendemos", "title2": "todas as marcas", "chips": "Marca A|Marca B|Marca C|Marca D|Marca E|Marca F", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("cliptitle-chip-cascade-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".t1").textContent = V.title1; $(".t2").textContent = V.title2;
            list(V.chips).forEach((c) => { const d = document.createElement("div"); d.className = "chip"; d.textContent = c; $(".chips").appendChild(d); });
            tl.fromTo($(".t1"), { clipPath: "inset(0 100% 0 0)", x: -80 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.3, ease: "power4.out" }, 0.1);
            tl.fromTo($(".t2"), { clipPath: "inset(0 0 0 100%)", x: 80 }, { clipPath: "inset(0 0 0 0%)", x: 0, duration: 0.3, ease: "power4.out" }, 0.35);
            tl.fromTo($(".t"), { textShadow: RGB(20) }, { textShadow: RGB(0), duration: 0.4 }, 0.35);
            $$(".chip").forEach((c, i) => tl.fromTo(c, { opacity: 0, x: i % 2 ? 80 : -80, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.22, ease: "back.out(2)" }, 0.6 + i * 0.08));
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["cliptitle-chip-cascade"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
