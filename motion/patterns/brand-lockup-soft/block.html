<!doctype html>
<!--
  simplicio-videos · motion/patterns/brand-lockup-soft/block.html — Assinatura suave da marca (anel + nome + @)
  Anel fino desenhado, nome da marca com espaçamento largo, subtítulo, mensagem em palavras que saltam, chip com @ e cidade; pontos coloridos estouram em volta. Logo opcional dentro do anel.
  HyperFrames block (sub-composition), 1080x1920, 4.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/brand-lockup-soft.html and add
    <div id="..." class="clip" data-composition-id="brand-lockup-soft" data-composition-src="compositions/brand-lockup-soft.html"
         data-start="T" data-duration="4.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "brand-lockup-soft" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="brand-lockup-soft"].
  Origin: authored for the kids/dental template (Lothus Odontologia, Dia das Criancas 2026).
-->
<html lang="pt-BR" data-composition-id="brand-lockup-soft" data-composition-duration="4.0" data-composition-variables='[{"id": "name", "type": "string", "label": "Nome", "default": "LOTHUS", "maxLength": 16}, {"id": "sub", "type": "string", "label": "Subtítulo", "default": "ODONTOLOGIA", "maxLength": 20}, {"id": "tagline", "type": "string", "label": "Mensagem", "default": "deseja um Feliz Dia das Crianças!", "maxLength": 44}, {"id": "handle", "type": "string", "label": "@ / contato", "default": "@lothus_odontologia", "maxLength": 28}, {"id": "city", "type": "string", "label": "Cidade", "default": "Guarulhos · SP", "maxLength": 32}, {"id": "logo", "type": "string", "label": "Logo REAL do cliente (caminho; vazio = só texto; nunca recriar)", "default": ""}, {"id": "logo_round", "type": "number", "label": "Logo em círculo (1 = avatar/selo redondo; 0 = logo largo, sem cortar)", "default": 1}, {"id": "logo_size", "type": "number", "label": "Lado do logo em px, centrado no anel (300 = padrão; até 440 redondo, até 330 largo)", "default": 300}, {"id": "logo_bg", "type": "string", "label": "Fundo do anel atrás do logo (cor; vazio = sem fundo). Use cor escura para logo claro com transparência", "default": ""}, {"id": "ink", "type": "color", "label": "Tinta", "default": "#3d3834"}, {"id": "accent", "type": "color", "label": "Destaque (chip, texto branco: use cor com contraste ≥3:1)", "default": "#2f7fc1"}, {"id": "colors", "type": "string", "label": "Paleta dos pontos (hex |)", "default": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb"}, {"id": "dur", "type": "number", "label": "Duração (s) = data-duration do host", "default": 4.0}, {"id": "bpm", "type": "number", "label": "BPM: anel/chip pulsam nas batidas (0 = respiração suave)", "default": 0}, {"id": "bg", "type": "string", "label": "Fundo", "default": "#fbf7f2"}, {"id": "tag_font", "type": "string", "label": "Fonte da mensagem (Fredoka = lúdica; Inter = sóbria)", "default": "Fredoka"}, {"id": "dots", "type": "number", "label": "Pontos coloridos em volta do anel (0 = nenhum, sóbrio)", "default": 14}, {"id": "tag_y", "type": "number", "label": "Topo da mensagem (px; 900 = padrão)", "default": 900}, {"id": "chip_y", "type": "number", "label": "Topo do chip @ (px; a cidade fica 130 px abaixo). Suba quando houver kinetic-words embaixo", "default": 1240}, {"id": "seed", "type": "number", "label": "Semente", "default": 4}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Assinatura suave da marca (anel + nome + @)</title>
  </head>
  <body>
    <template>
      <div id="brand-lockup-soft-root" data-composition-id="brand-lockup-soft" data-duration="4.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
          [data-composition-id="brand-lockup-soft"] { position: absolute; inset: 0; overflow: hidden; color: #3d3834; font-family: "Inter", sans-serif; background: var(--bg, transparent); }
          [data-composition-id="brand-lockup-soft"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="brand-lockup-soft"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="brand-lockup-soft"] .ring { position: absolute; left: 290px; top: 300px; width: 500px; height: 500px; }
          [data-composition-id="brand-lockup-soft"] .nm { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-weight: 300; font-size: 84px; letter-spacing: 0.32em; padding-left: 0.32em; }
          [data-composition-id="brand-lockup-soft"] .sb { position: absolute; left: 0; right: 0; top: 585px; text-align: center; font-weight: 400; font-size: 36px; letter-spacing: 0.42em; padding-left: 0.42em; }
          [data-composition-id="brand-lockup-soft"] .lg { position: absolute; left: 390px; top: 400px; width: 300px; height: 300px; object-fit: contain; border-radius: 50%; }
          [data-composition-id="brand-lockup-soft"] .tg { position: absolute; left: 70px; right: 70px; top: 900px; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 84px; line-height: 1.12; }
          [data-composition-id="brand-lockup-soft"] .chip { position: absolute; left: 50%; top: 1240px; padding: 22px 44px; border-radius: 60px; color: #fff; font-weight: 700; font-size: 46px; white-space: nowrap; }
          [data-composition-id="brand-lockup-soft"] .ct { position: absolute; left: 0; right: 0; top: 1370px; text-align: center; font-weight: 500; font-size: 40px; opacity: 0.75; }
          [data-composition-id="brand-lockup-soft"] .dot { position: absolute; left: 0; top: 0; border-radius: 50%; }
        </style>
        <svg class="ring" viewBox="0 0 500 500"><circle cx="250" cy="250" r="240" fill="none" stroke-width="6" stroke-linecap="round" transform="rotate(-90 250 250)"/></svg>
        <img class="lg" alt="" /><div class="nm"></div><div class="sb"></div><div class="tg"></div><div class="chip"></div><div class="ct"></div><div class="dots"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"name": "LOTHUS", "sub": "ODONTOLOGIA", "tagline": "deseja um Feliz Dia das Crianças!", "handle": "@lothus_odontologia", "city": "Guarulhos · SP", "logo": "", "logo_round": 1, "logo_size": 300, "logo_bg": "", "ink": "#3d3834", "accent": "#2f7fc1", "colors": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb", "dur": 4.0, "bpm": 0, "bg": "#fbf7f2", "tag_font": "Fredoka", "dots": 14, "tag_y": 900, "chip_y": 1240, "seed": 4};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("brand-lockup-soft-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            root.style.setProperty("--bg", V.bg || "transparent");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const R = rng(V.seed), pal = list(V.colors), C0 = 2 * Math.PI * 240;
            const ring = $(".ring circle"); ring.setAttribute("stroke", V.ink); ring.style.strokeDasharray = C0;
            if (V.logo && V.logo_bg) { ring.setAttribute("fill", V.logo_bg); ring.setAttribute("fill-opacity", "0"); }  // plate for light logos
            root.style.color = V.ink; const nm = $(".nm"), sb = $(".sb"), lg = $(".lg");
            if (V.logo) { lg.src = V.logo; nm.style.display = sb.style.display = "none"; if (!Number(V.logo_round)) lg.style.borderRadius = "0";
              const ls = Number(V.logo_size) || 300; if (ls !== 300) { lg.style.width = lg.style.height = ls + "px"; lg.style.left = (540 - ls / 2) + "px"; lg.style.top = (550 - ls / 2) + "px"; } } else { lg.style.display = "none"; }
            // text lockup must stay inside the ring (chord ~440 px at the name/sub rows): shrink long names/subs only
            const fit = (el, text, px, em, maxw) => { const n = String(text).length; if (n * em * px > maxw) el.style.fontSize = Math.floor(maxw / (n * em)) + "px"; };  // em = measured width/char incl. letter-spacing
            fit(nm, V.name, 84, 0.80, 440); fit(sb, V.sub, 36, 0.98, 420);
            const nch = splitChars(nm, V.name), sch = splitChars(sb, V.sub);
            if (V.tag_font && V.tag_font !== "Fredoka") $(".tg").style.fontFamily = `"${V.tag_font}", sans-serif`;
            $(".tg").style.top = V.tag_y + "px"; $(".chip").style.top = V.chip_y + "px"; $(".ct").style.top = (V.chip_y + 130) + "px";
            const tw = splitWords($(".tg"), V.tagline); const chip = $(".chip"); chip.textContent = V.handle; chip.style.background = V.accent; $(".ct").textContent = V.city;
            tl.fromTo(ring, { strokeDashoffset: C0 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.1);
            if (V.logo && V.logo_bg) tl.fromTo(ring, { attr: { "fill-opacity": 0 } }, { attr: { "fill-opacity": 1 }, duration: 0.5, ease: "power2.out" }, 0.1);
            tl.fromTo(lg, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.35);
            tl.fromTo(nch, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.05, ease: "power3.out" }, 0.35);
            tl.fromTo(sch, { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03, ease: "none" }, 0.7);
            tl.fromTo(tw, { yPercent: 110 }, { yPercent: 0, duration: 0.45, stagger: 0.07, ease: "back.out(2)" }, 1.0);
            tl.fromTo(chip, { xPercent: -50, scale: 0 }, { xPercent: -50, scale: 1, duration: 0.5, ease: "back.out(2.5)" }, 1.6);
            tl.fromTo(".ct", { y: 20, opacity: 0 }, { y: 0, opacity: 0.75, duration: 0.4, ease: "power2.out" }, 1.8);
            const dots = $(".dots");
            const ND = Math.max(0, Math.round(Number(V.dots ?? 14)));
            for (let i = 0; i < ND; i++) {
              const d = document.createElement("div"); d.className = "dot"; const s = 16 + R() * 26; d.style.width = d.style.height = s + "px"; d.style.background = pal[i % pal.length]; dots.appendChild(d);
              const a = (i / ND) * Math.PI * 2, rr = 300 + R() * 60, x = 540 + Math.cos(a) * rr - s / 2, y = 550 + Math.sin(a) * rr - s / 2;
              tl.fromTo(d, { x: 540, y: 550, scale: 0 }, { x, y, scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.5 + i * 0.03);
              tl.to(d, { y: y - 16, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.2 + i * 0.03);
            }
            if (V.bpm > 0) { const B = 60 / V.bpm, rg = root.querySelector(".ring");
              for (let u = 1.2; u < V.dur - 0.2; u += B) { tl.fromTo(rg, { scale: 1.06 }, { scale: 1, duration: B * 0.8, ease: "power2.out", immediateRender: false }, u);
                tl.fromTo(chip, { scale: 1.08 }, { scale: 1, duration: B * 0.8, ease: "power2.out", immediateRender: false }, u + 0.4 > 1.6 ? u : 1.6); }
            } else tl.to(root.querySelector(".ring"), { scale: 1.03, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);
            tl.set({}, {}, V.dur);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["brand-lockup-soft"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
