<!doctype html>
<!--
  simplicio-videos · motion/patterns/word-mask-highlight/block.html — Revelação por máscara de palavras + faixa destacada
  Frase entra palavra a palavra por máscara (yPercent); o trecho final ganha uma faixa de cor que varre da esquerda no tempo da palavra falada.
  HyperFrames block (sub-composition), 1080x1920, 2.2s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/word-mask-highlight.html and add
    <div id="..." class="clip" data-composition-id="word-mask-highlight" data-composition-src="compositions/word-mask-highlight.html"
         data-start="T" data-duration="2.2" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "word-mask-highlight" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="word-mask-highlight"].
  Extraído de clients/wjr-informatica-games/video-01 (cena S2).
-->
<html lang="pt-BR" data-composition-id="word-mask-highlight" data-composition-duration="2.2" data-composition-variables='[{"id": "text", "type": "string", "label": "Frase (antes do destaque)", "default": "A gente resolve", "maxLength": 40}, {"id": "highlight", "type": "string", "label": "Trecho destacado", "default": "sem enrolação.", "maxLength": 30}, {"id": "t_hl", "type": "string", "label": "Tempo do destaque (s)", "default": "0.9"}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Revelação por máscara de palavras + faixa destacada</title>
  </head>
  <body>
    <template>
      <div id="word-mask-highlight-root" data-composition-id="word-mask-highlight" data-duration="2.2" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="word-mask-highlight"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="word-mask-highlight"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="word-mask-highlight"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="word-mask-highlight"] .title { position: absolute; left: 80px; right: 80px; top: 700px; font-size: 150px; }
          [data-composition-id="word-mask-highlight"] .hlwrap { position: relative; display: inline-block; margin-top: 12px; }
          [data-composition-id="word-mask-highlight"] .hlbg { position: absolute; left: -14px; right: -14px; top: 18%; bottom: 4%; background: var(--primary); transform-origin: left center; }
          [data-composition-id="word-mask-highlight"] .hltext { position: relative; }
        </style>
        <h1 class="title anton"><div class="a"></div><span class="hlwrap"><span class="hlbg"></span><span class="hltext"></span></span></h1>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"text": "A gente resolve", "highlight": "sem enrolação.", "t_hl": "0.9", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("word-mask-highlight-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const wa = splitWords($(".a"), V.text), wb = splitWords($(".hltext"), V.highlight), t = +V.t_hl;
            tl.fromTo(wa, { yPercent: 110 }, { yPercent: 0, duration: 0.3, stagger: 0.06, ease: "power3.out" }, 0.1);
            tl.fromTo($(".hlbg"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out" }, t);
            tl.fromTo(wb, { yPercent: 110 }, { yPercent: 0, duration: 0.3, stagger: 0.05, ease: "back.out(2)" }, t + 0.05);
            tl.fromTo($(".title"), { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "power3.out" }, t);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["word-mask-highlight"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
