<!doctype html>
<!--
  simplicio-videos · motion/patterns/odometer-digit-roll/block.html — Número em odômetro (dígitos rolando)
  Número grande: cada dígito é um rolo 0–9 que gira e para da esquerda para a direita com meio passo de overshoot; ao travar tudo, pulso de escala e rótulo aparece.
  HyperFrames block (sub-composition), 1080x1920, 3.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/odometer-digit-roll.html and add
    <div id="..." class="clip" data-composition-id="odometer-digit-roll" data-composition-src="compositions/odometer-digit-roll.html"
         data-start="T" data-duration="3.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "odometer-digit-roll" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="odometer-digit-roll"].
  Técnica do card 'odometer-digit-roll' do video-shotcraft, reimplementada (GSAP, sem código do original).
-->
<html lang="pt-BR" data-composition-id="odometer-digit-roll" data-composition-duration="3.0" data-composition-variables='[{"id": "value", "type": "string", "label": "Valor (ex.: 100%, 24h, 15+)", "default": "100%", "maxLength": 8}, {"id": "label", "type": "string", "label": "Rótulo", "default": "de clientes atendidos", "maxLength": 40}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Número em odômetro (dígitos rolando)</title>
  </head>
  <body>
    <template>
      <div id="odometer-digit-roll-root" data-composition-id="odometer-digit-roll" data-duration="3.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="odometer-digit-roll"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="odometer-digit-roll"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="odometer-digit-roll"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="odometer-digit-roll"] .num { position: absolute; left: 0; right: 0; top: 640px; display: flex; justify-content: center; font-family: "Anton", sans-serif; font-size: 360px; line-height: 1; }
          [data-composition-id="odometer-digit-roll"] .dg { position: relative; height: 1em; overflow: hidden; width: .56em; }
          [data-composition-id="odometer-digit-roll"] .dg .strip { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
          [data-composition-id="odometer-digit-roll"] .dg .strip span { height: 1em; }
          [data-composition-id="odometer-digit-roll"] .fx { color: var(--primary); }
          [data-composition-id="odometer-digit-roll"] .lb { position: absolute; left: 80px; right: 80px; top: 1080px; text-align: center; font-size: 52px; font-weight: 700; color: #ddd; }
        </style>
        <div class="num"></div><div class="lb"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"value": "100%", "label": "de clientes atendidos", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("odometer-digit-roll-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".lb").textContent = V.label;
            const rolls = [];
            [...String(V.value)].forEach((c) => {
              if (/[0-9]/.test(c)) { const d = document.createElement("div"); d.className = "dg"; const s = document.createElement("div"); s.className = "strip";
                for (let k = 0; k < 30; k++) { const sp = document.createElement("span"); sp.textContent = k % 10; s.appendChild(sp); } d.appendChild(s); $(".num").appendChild(d); rolls.push([s, +c]); }
              else { const f = document.createElement("div"); f.className = "fx"; f.textContent = c; $(".num").appendChild(f); }
            });
            rolls.forEach(([s, v], i) => { const target = 20 + v; // land on the third lap
              tl.fromTo(s, { yPercent: 0 }, { yPercent: -((target + 0.5) / 30) * 100, duration: 0.9 + i * 0.22, ease: "power3.out" }, 0.15);
              tl.to(s, { yPercent: -(target / 30) * 100, duration: 0.2, ease: "back.out(3)" }, 0.15 + 0.9 + i * 0.22); });
            const lock = 0.15 + 0.9 + (rolls.length - 1) * 0.22 + 0.2;
            tl.fromTo($(".num"), { scale: 1 }, { scale: 1.035, duration: 0.13, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, lock);
            tl.fromTo($(".lb"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, lock);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["odometer-digit-roll"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
