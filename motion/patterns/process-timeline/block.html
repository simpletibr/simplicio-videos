<!doctype html>
<!--
  simplicio-videos · motion/patterns/process-timeline/block.html — Linha do tempo de processo (trilho + passos)
  Título entra por letra; um trilho vertical se desenha (stroke-dashoffset) e os passos numerados saltam no trilho em sequência.
  HyperFrames block (sub-composition), 1080x1920, 2.5s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/process-timeline.html and add
    <div id="..." class="clip" data-composition-id="process-timeline" data-composition-src="compositions/process-timeline.html"
         data-start="T" data-duration="2.5" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "process-timeline" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="process-timeline"].
  Extraído de clients/wjr-informatica-games/video-01 (cena S5).
-->
<html lang="pt-BR" data-composition-id="process-timeline" data-composition-duration="2.5" data-composition-variables='[{"id": "kicker", "type": "string", "label": "Kicker", "default": "Como funciona", "maxLength": 24}, {"id": "title", "type": "string", "label": "Título", "default": "Simples assim.", "maxLength": 20}, {"id": "steps", "type": "string", "label": "Passos (|)", "default": "Você chama|A gente avalia|Você aprova"}, {"id": "primary", "type": "color", "label": "Cor primária", "default": "#e50914"}, {"id": "secondary", "type": "color", "label": "Cor secundária", "default": "#1565ff"}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Linha do tempo de processo (trilho + passos)</title>
  </head>
  <body>
    <template>
      <div id="process-timeline-root" data-composition-id="process-timeline" data-duration="2.5" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          [data-composition-id="process-timeline"] { position: absolute; inset: 0; overflow: hidden; color: #fff; font-family: "Inter", sans-serif;
            background: radial-gradient(120% 70% at 50% 35%, #1a1a1f 0%, #080808 70%); }
          [data-composition-id="process-timeline"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="process-timeline"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="process-timeline"] .kick { position: absolute; left: 80px; top: 360px; font-size: 40px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--secondary); }
          [data-composition-id="process-timeline"] .tt { position: absolute; left: 80px; right: 80px; top: 420px; font-size: 140px; }
          [data-composition-id="process-timeline"] svg.rail { position: absolute; left: 110px; top: 700px; width: 40px; height: 700px; overflow: visible; }
          [data-composition-id="process-timeline"] .st { position: absolute; left: 90px; display: flex; align-items: center; gap: 36px; font-size: 58px; font-weight: 800; }
          [data-composition-id="process-timeline"] .st b { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: #0d0d0d; border: 6px solid var(--primary); font-size: 36px; }
        </style>
        <div class="kick"></div><h2 class="tt anton"></h2><svg class="rail" viewBox="0 0 40 700"><line x1="20" y1="0" x2="20" y2="600" stroke="var(--primary)" stroke-width="8" stroke-dasharray="600" stroke-dashoffset="600" class="ln"/></svg><div class="steps"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"kicker": "Como funciona", "title": "Simples assim.", "steps": "Você chama|A gente avalia|Você aprova", "primary": "#e50914", "secondary": "#1565ff"};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("process-timeline-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            $(".kick").textContent = V.kicker;
            const ch = splitChars($(".tt"), V.title), steps = list(V.steps);
            steps.forEach((s, i) => { const d = document.createElement("div"); d.className = "st"; d.style.top = (700 + i * (600 / Math.max(1, steps.length - 1)) - 40) + "px";
              const b = document.createElement("b"); b.textContent = String(i + 1).padStart(2, "0"); d.append(b, s); $(".steps").appendChild(d); });
            tl.fromTo($(".kick"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0);
            tl.fromTo(ch, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.18, stagger: 0.015, ease: "back.out(3)" }, 0.02);
            tl.fromTo($(".ln"), { attr: { "stroke-dashoffset": 600 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "none" }, 0.2);
            $$(".st").forEach((d, i, a) => tl.fromTo(d, { opacity: 0, x: 90, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.2, ease: "back.out(2.5)" }, 0.2 + i * (1.1 / Math.max(1, a.length - 1))));
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["process-timeline"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
