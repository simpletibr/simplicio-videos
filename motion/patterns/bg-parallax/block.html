<!doctype html>
<!--
  simplicio-videos · motion/patterns/bg-parallax/block.html — Fundo em movimento (parallax de formas + zoom contínuo)
  Três camadas em parallax (manchas desfocadas lentas, formas de contorno médias, pontinhos rápidos) subindo e girando, zoom contínuo leve e pulso opcional nas batidas. Nunca fica parado; cores da paleta sobre o fundo claro.
  HyperFrames block (sub-composition), 1080x1920, 16.0s. Params = data-composition-variables (see pattern.json).
  Mount: copy to <project>/compositions/bg-parallax.html and add
    <div id="..." class="clip" data-composition-id="bg-parallax" data-composition-src="compositions/bg-parallax.html"
         data-start="T" data-duration="16.0" data-track-index="N" data-variable-values='{...}'></div>
  Contract (same as the HyperFrames registry components): the runtime clones only the <template>; the
  paused timeline registers under the literal "bg-parallax" key. Deterministic: seeded rng only, no Math.random,
  Date.now, fetch or infinite repeats. Styles are scoped under [data-composition-id="bg-parallax"].
  Origin: authored for the kids/dental template v2 (Lothus Odontologia, Dia das Criancas 2026, fast/beat-synced cut).
-->
<html lang="pt-BR" data-composition-id="bg-parallax" data-composition-duration="16.0" data-composition-variables='[{"id": "colors", "type": "string", "label": "Paleta (hex |)", "default": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb"}, {"id": "base", "type": "string", "label": "Cor de fundo", "default": "#fbf7f2"}, {"id": "center", "type": "string", "label": "Cor do centro do gradiente (#ffffff = padrão claro; use escura em tema escuro)", "default": "#ffffff"}, {"id": "ink", "type": "color", "label": "Contorno das formas", "default": "#3d3834"}, {"id": "dur", "type": "number", "label": "Duração (s) = data-duration do host", "default": 16.0}, {"id": "speed", "type": "number", "label": "Velocidade base (px/s)", "default": 60}, {"id": "zoom", "type": "number", "label": "Zoom contínuo (0,06 = 6 %)", "default": 0.06}, {"id": "bpm", "type": "number", "label": "BPM para o pulso (0 = sem pulso)", "default": 0}, {"id": "shapes", "type": "number", "label": "Formas na camada média", "default": 18}, {"id": "dots", "type": "number", "label": "Pontinhos na camada da frente", "default": 26}, {"id": "seed", "type": "number", "label": "Semente", "default": 7}]'>
  <head>
    <meta charset="UTF-8" />
    <title>Fundo em movimento (parallax de formas + zoom contínuo)</title>
  </head>
  <body>
    <template>
      <div id="bg-parallax-root" data-composition-id="bg-parallax" data-duration="16.0" data-width="1080" data-height="1920" data-fps="30">
        <style>
          @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
          @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
          @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
          [data-composition-id="bg-parallax"] { position: absolute; inset: 0; overflow: hidden; color: #3d3834; font-family: "Inter", sans-serif; background: var(--bg, transparent); }
          [data-composition-id="bg-parallax"] * { margin: 0; padding: 0; box-sizing: border-box; }
          [data-composition-id="bg-parallax"] .anton { font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 0.95; }
          [data-composition-id="bg-parallax"] .base { position: absolute; inset: -60px; }
          [data-composition-id="bg-parallax"] .lay { position: absolute; inset: 0; }
          [data-composition-id="bg-parallax"] .blob { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(70px); opacity: 0.32; }
          [data-composition-id="bg-parallax"] .shp { position: absolute; left: 0; top: 0; }
          [data-composition-id="bg-parallax"] .dt { position: absolute; left: 0; top: 0; border-radius: 50%; }
        </style>
        <div class="base"></div><div class="lay l1"></div><div class="lay l2"></div><div class="lay l3"></div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (() => {
            // ---- params: block defaults < host data-variable-values < CLI --variables ----
            const DEF = {"colors": "#ff6b6b|#ffd23f|#4ecdc4|#5aa9e6|#b388eb", "base": "#fbf7f2", "center": "#ffffff", "ink": "#3d3834", "dur": 16.0, "speed": 60, "zoom": 0.06, "bpm": 0, "shapes": 18, "dots": 26, "seed": 7};
            const HV = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            const V = Object.assign({}, DEF, HV);
            const root = document.getElementById("bg-parallax-root");
            const $ = (s) => root.querySelector(s), $$ = (s) => [...root.querySelectorAll(s)];
            root.style.setProperty("--primary", V.primary || "#e50914");
            root.style.setProperty("--secondary", V.secondary || "#1565ff");
            root.style.setProperty("--bg", V.bg || "transparent");
            const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const splitChars = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const wb = document.createElement("span"); wb.style.display = "inline-block"; wb.style.whiteSpace = "nowrap";
              [...w].forEach((c) => { const s = document.createElement("span"); s.className = "ch"; s.style.display = "inline-block"; s.textContent = c; wb.appendChild(s); }); el.appendChild(wb); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".ch")]; };
            const splitWords = (el, text) => { el.textContent = ""; text.split(" ").forEach((w, i, a) => { const m = document.createElement("span"); m.style.display = "inline-block"; m.style.overflow = "hidden"; m.style.verticalAlign = "top"; m.style.padding = "0.2em 0.04em 0.04em"; m.style.margin = "-0.2em -0.04em -0.04em";
              const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = w; m.appendChild(s); el.appendChild(m); if (i < a.length - 1) el.appendChild(document.createTextNode(" ")); }); return [...el.querySelectorAll(".wd")]; };
            const RGB = (px) => `${px}px 0 0 ${V.primary}, ${-px}px 0 0 ${V.secondary}`;
            const list = (s) => String(s).split("|").map((x) => x.trim()).filter(Boolean);
            const tl = gsap.timeline({ paused: true });
            const R = rng(V.seed), pal = list(V.colors), H = 1920, NS = "http://www.w3.org/2000/svg";
            $(".base").style.background = `radial-gradient(90% 60% at 50% 40%, ${V.center || "#ffffff"} 0%, ${V.base} 55%, ${V.base} 100%)`;
            const drift = (el, speed, x0, y0, rot) => { // moves up by speed*dur, starting spread so the screen is always populated
              const dist = speed * V.dur;
              tl.fromTo(el, { x: x0, y: y0, rotation: 0 }, { x: x0 + (R() - 0.5) * 160, y: y0 - dist, rotation: rot, duration: V.dur, ease: "none" }, 0);
            };
            const l1 = $(".l1"), l2 = $(".l2"), l3 = $(".l3");
            for (let i = 0; i < 6; i++) {
              const b = document.createElement("div"); b.className = "blob"; const s = 380 + R() * 260; b.style.width = b.style.height = s + "px"; b.style.background = pal[i % pal.length]; l1.appendChild(b);
              drift(b, V.speed * 0.35, -150 + R() * 1000, -200 + R() * (H + V.speed * 0.35 * V.dur), (R() - 0.5) * 40);
            }
            const kinds = ["ring", "star", "tri", "plus", "dot"];
            for (let i = 0; i < V.shapes; i++) {
              const k = kinds[i % kinds.length], s = 46 + R() * 50, col = pal[(i * 2) % pal.length], d = document.createElement("div"); d.className = "shp";
              const sw = 7;
              d.innerHTML = k === "ring" ? `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="${col}" stroke-width="14"/></svg>`
                : k === "star" ? `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50,0 L61,35 L98,35 L68,57 L79,92 L50,70 L21,92 L32,57 L2,35 L39,35 Z" fill="${col}" stroke="${V.ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-opacity="0.25"/></svg>`
                : k === "tri" ? `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50,10 L92,86 L8,86 Z" fill="none" stroke="${col}" stroke-width="13" stroke-linejoin="round"/></svg>`
                : k === "plus" ? `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50,12 L50,88 M12,50 L88,50" stroke="${col}" stroke-width="16" stroke-linecap="round"/></svg>`
                : `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="${col}"/></svg>`;
              d.style.opacity = 0.55; l2.appendChild(d);
              const sp = V.speed * (0.9 + R() * 0.5);
              drift(d, sp, R() * 1040 - 20, -150 + R() * (H + 300 + sp * V.dur), (R() < 0.5 ? -1 : 1) * (90 + R() * 220));
            }
            for (let i = 0; i < V.dots; i++) {
              const d = document.createElement("div"); d.className = "dt"; const s = 10 + R() * 16; d.style.width = d.style.height = s + "px"; d.style.background = pal[i % pal.length]; d.style.opacity = 0.8; l3.appendChild(d);
              const sp = V.speed * (1.8 + R() * 0.8);
              drift(d, sp, R() * 1080, -60 + R() * (H + 120 + sp * V.dur), 0);
            }
            tl.fromTo(root, { scale: 1 }, { scale: 1 + V.zoom, duration: V.dur, ease: "none", transformOrigin: "50% 45%" }, 0);
            if (V.bpm > 0) { const B = 60 / V.bpm; for (let t = 0; t < V.dur - 0.05; t += B) tl.fromTo(l2, { scale: 1.07 }, { scale: 1, duration: Math.min(0.35, B * 0.9), ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, t); }
            tl.set({}, {}, V.dur);
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["bg-parallax"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
