# simplicio-video (issue #43). Só build local: não há imagem pública (ver Dockerfile e docs/host/packaging.md).
# Uso: docker compose build && docker compose run --rm simplicio doctor
# Atualizar = reconstruir a imagem (docker compose build); `update` e `install` não se aplicam dentro do contêiner (veja o Dockerfile).
# O contêiner trabalha em /workspace (o volume `workspace`): `init`, contratos e MP4 ficam lá e sobrevivem ao --rm.
name: simplicio-video

services:
  simplicio:
    build:
      context: .
      dockerfile: Dockerfile
    image: simplicio-video:local
    environment:
      # Passada do seu shell em tempo de execução. Nunca gravada na imagem.
      GEMINI_API_KEY:
    volumes:
      - workspace:/workspace

volumes:
  workspace:
