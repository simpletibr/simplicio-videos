[build-system]
requires = ["setuptools>=77"]  # 77 is the first release with SPDX `license` expressions and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "simplicio-video"
version = "0.4.0"
description = "Simplicio Runtime video plugin: deterministic contract (YAML) -> HyperFrames -> MP4 CLI"
readme = { file = "PYPI.md", content-type = "text/markdown" }  # the PyPI page; README.md is the GitHub one
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wesley Simplicio" }]  # no e-mail on purpose
keywords = ["video", "mp4", "hyperframes", "cli", "mcp", "tts", "motion-graphics", "deterministic", "ffmpeg", "simplicio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",  # Linux only: macOS and Windows are not confirmed on real machines yet
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.6", "shellcheck-py>=0.10"]
local-tts = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
mcp = ["mcp>=1.2"]
remote = ["kaggle>=2.2", "google-colab-cli>=0.7"]

[project.urls]
Homepage = "https://github.com/simpletibr/simplicio-videos"
Repository = "https://github.com/simpletibr/simplicio-videos"
Issues = "https://github.com/simpletibr/simplicio-videos/issues"
Changelog = "https://github.com/simpletibr/simplicio-videos/blob/main/CHANGELOG.md"

[project.scripts]
simplicio-video = "simplicio_video.cli:main"
simplicio-video-mcp = "simplicio_video.mcp_server:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simplicio_video = ["engine/*", "data/**/*"]

# The data/**/* glob would also pick up a .pyc that sits in data/ (sdist and wheel); this drops it without any build warning.
[tool.setuptools.exclude-package-data]
simplicio_video = ["**/__pycache__/*", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sockets are blocked by default (pytest-socket); render/integration/ui tests are re-enabled in tests/conftest.py.
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "unit: fast, hermetic, no network (the default for untagged tests)",
    "contract: schema and plugin-contract suites (offline)",
    "e2e: end-to-end flow on fakes (offline)",
    "integration: talks to a real local tool or service (may use the network; excluded from `make check`)",
    "render: renders a short video with HyperFrames (needs node>=22, ffmpeg, chrome; uses npx, so the network; excluded from `make check`)",
    "ui: browser/UI tests (excluded from `make check`)",
    "slow: takes more than a few seconds (excluded from `make check`)",
]

[tool.ruff]
# Only the engine and the scripts are gated; scripts/check.sh also lints the files a branch changes.
include = ["src/simplicio_video/**/*.py", "scripts/**/*.py"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E731"]  # legacy style in the engine: ambiguous `l` and lambda assignments

[tool.ruff.lint.per-file-ignores]
# Legacy findings owned by other issues; remove the entry when the owner fixes the file.
"src/simplicio_video/pipeline.py" = ["F541"]
"src/simplicio_video/render.py" = ["F401", "F541"]
"src/simplicio_video/voice.py" = ["F401"]
