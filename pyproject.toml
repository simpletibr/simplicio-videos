[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplicio-video"
version = "0.3.0"
description = "Simplicio Runtime video plugin: deterministic contract (YAML) -> HyperFrames -> MP4 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]
local-tts = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
mcp = ["mcp>=1.2"]
remote = ["kaggle>=2.2", "google-colab-cli>=0.7"]

[project.scripts]
simplicio-video = "simplicio_video.cli:main"
simplicio-video-mcp = "simplicio_video.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simplicio_video = ["engine/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: renders a short video with HyperFrames (needs node>=22, ffmpeg, chrome)"]
