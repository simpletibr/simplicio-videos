<!doctype html>
<!--
  WJR video-02 (video-use cutdown) — transparent overlay, rendered to MOV (ProRes 4444, alpha)
  and composited by video-use's render.py (EDL "overlays").
  - progress bar (brand primary) across the whole cutdown
  - RGB glitch slices + short flash centred on the edit point (cut_t), masking the jump
  Deterministic: seeded rng, no Math.random/Date.now/fetch. Colors/times are variables.
  Look reimplemented from motion/patterns/transition-glitch-rgb (same repo).
-->
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"duration","type":"number","label":"Duração do corte (s)","default":11.5},
    {"id":"cut_t","type":"number","label":"Tempo do corte na saída (s)","default":4.0},
    {"id":"primary","type":"color","label":"Cor primária","default":"#e50914"},
    {"id":"secondary","type":"color","label":"Cor secundária","default":"#1565ff"},
    {"id":"seed","type":"number","label":"Semente","default":7}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #track { position: absolute; left: 0; top: 0; width: 1080px; height: 10px; background: rgba(255,255,255,0.14); }
      #bar { position: absolute; left: 0; top: 0; width: 1080px; height: 10px; transform-origin: left center; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .slice { position: absolute; left: 0; width: 1080px; opacity: 0; mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.5" data-width="1080" data-height="1920">
      <div id="track"></div>
      <div id="bar"></div>
      <div id="slices"></div>
      <div id="flash"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const V = Object.assign(
        { duration: 11.5, cut_t: 4.0, primary: "#e50914", secondary: "#1565ff", seed: 7 },
        (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}
      );
      // mulberry32 seeded rng (deterministic)
      let s = V.seed >>> 0;
      const rng = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

      const bar = document.getElementById("bar");
      bar.style.background = V.primary;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: V.duration, ease: "none" }, 0);

      // glitch slices around the cut
      const box = document.getElementById("slices");
      const N = 9, t0 = V.cut_t - 0.18;
      for (let i = 0; i < N; i++) {
        const el = document.createElement("div");
        el.className = "slice";
        const h = 30 + Math.round(rng() * 140);
        el.style.top = Math.round(rng() * (1920 - h)) + "px";
        el.style.height = h + "px";
        el.style.background = [V.primary, V.secondary, "#ffffff"][i % 3];
        box.appendChild(el);
        const dir = i % 2 ? 1 : -1, at = t0 + rng() * 0.2;
        tl.fromTo(el, { x: dir * -1080, opacity: 0.85 }, { x: dir * 1080, duration: 0.22, ease: "power2.inOut" }, at);
        tl.set(el, { opacity: 0 }, at + 0.22);
      }
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05, ease: "none" }, V.cut_t - 0.03);
      tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power2.out" }, V.cut_t + 0.02);
      tl.set({}, {}, V.duration);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
