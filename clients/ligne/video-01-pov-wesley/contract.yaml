# simplicio.video-contract/v1 — Ligne · video-01 POV (Wesley) · Reels 26 s, 9:16.
# Forma do Reel @useligne Den1y0iMUNY (gancho POV com rosto → pan nas pranchas → fecho); imagem, texto e áudio são do próprio Wesley.
# Fatos só de ../coleta/ (fontes.md): produto, @useligne, ligne.site e as 7 pranchas do exemplo do Wesley (3e51ebb8…).
# Sem números da página (5 min, 4,9/5, 100%): não confirmados. Sem voz (o original é só música); trilha gerada pela esteira.
# v4: revisão contra o original (gancho com texto já no 1º quadro e rosto maior; pranchas sem selo/sombra e com zoom 1,4 para mostrar mais conteúdo). v3: cortes nos instantes do Reel original (3,77/7,23/10,97/14,87/16,93/19,0/22,97 s); áudio da faixa do post trocado depois do render (ver legenda.md/pendencias.md). v2: 128 BPM (pop dance como o original), cortes a cada 1–2 compassos (3,75 s / 1,875 s), 7 pranchas, soco de zoom + whoosh/hit em cada corte, drop na última prancha.
