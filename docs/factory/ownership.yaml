# Machine-readable ownership map. `scripts/check_ownership.py <issue>` compares a PR's changed files
# with `owns` (glob patterns, `**` = any depth) plus `generated`. Anything else fails the check.
# `path#section` means the file is shared and the issue owns only that named part (a section of
# pyproject.toml, a function of app.py, a heading of a doc); the checker allows the file and the
# reviewer verifies the section. Generated files may be regenerated by anyone with `make regen`.
schema: simplicio.ownership/v1

generated:         # never hand-edited; regenerate with `make regen`
  - "plugin.json"
  - "schemas/factory/*.json"
  - "docs/reference/**"
  - "web/shared/src/generated/**"

