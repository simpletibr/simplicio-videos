<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simplicio Panel Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a control room. A quiet instrument panel (neutral surfaces, hairline borders,
   one accent that follows the chosen theme) wrapped around a lively 2D conveyor scene.
   Desktop: left rail + header + page. Phone: top bar + page + bottom tabs. The frame is a container,
   so the layout answers to the frame width, not the browser width. */
:root{
  --bg:#e8f1fa; --surface:#ffffff; --surface-2:#f2f8fd; --line:#d1dfec; --line-strong:#b0c6da;
  --fg:#0f2233; --muted:#4a6176; --faint:#7b92a6;
  --accent:#58b4ff; --accent-ink:#04213f; --accent-text:#0a5fa8;
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--surface));
  --good:#17865a; --warn:#a56a00; --bad:#c23636; --info:#2161c4;
  --good-bg:#e1f3e9; --warn-bg:#fcefcf; --bad-bg:#fae3e3; --info-bg:#e1ebfa;
  --code-bg:#0b1522; --code-fg:#d3e6f8;
  --shadow:0 1px 2px rgba(10,30,60,.07), 0 10px 28px rgba(10,30,60,.08);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a121b; --surface:#111c29; --surface-2:#162434; --line:#233447; --line-strong:#36506a;
    --fg:#e8f0f8; --muted:#9db3c8; --faint:#6e869c;
    --accent:#5dbbff; --accent-ink:#04213f; --accent-text:#8fd0ff;
    --good:#4cc790; --warn:#e3a93a; --bad:#ef7676; --info:#79a9f0;
    --good-bg:#12302a; --warn-bg:#352a10; --bad-bg:#3a1b1b; --info-bg:#16284a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a121b; --surface:#111c29; --surface-2:#162434; --line:#233447; --line-strong:#36506a;
  --fg:#e8f0f8; --muted:#9db3c8; --faint:#6e869c;
  --accent:#5dbbff; --accent-ink:#04213f; --accent-text:#8fd0ff;
  --good:#4cc790; --warn:#e3a93a; --bad:#ef7676; --info:#79a9f0;
  --good-bg:#12302a; --warn-bg:#352a10; --bad-bg:#3a1b1b; --info-bg:#16284a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype chrome (not part of the app) ---------- */
.page{padding-inline:16px;padding-block:14px 40px;max-width:1360px;margin-inline:auto}
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:14px}
.proto .ttl{display:flex;flex-direction:column;gap:0;min-width:0}
.proto h1{font-size:17px;font-weight:700}
.proto .sub{font-size:12px;color:var(--muted)}
.proto .ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-inline-start:auto}
.proto label.l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.proto select{height:32px;padding:0 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);max-width:190px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{padding:5px 11px;border:0;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.stage{display:flex;justify-content:center}
.frame{container:frame / inline-size;width:min(100%,1240px);height:min(86vh,840px);min-height:560px;border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);position:relative}
.frame[data-device="phone"]{width:min(100%,392px);height:min(88vh,812px);border:9px solid #0a0f0d;border-radius:38px}
.frame[data-full="1"]{height:auto!important;min-height:0;overflow:visible}
.frame[data-full="1"] .app{height:auto}
.frame[data-full="1"] .main{overflow:visible}
.notes{margin-top:18px;display:grid;gap:10px;font-size:13px;color:var(--muted)}
.notes strong{color:var(--fg)}
@media (min-width:900px){.notes{grid-template-columns:repeat(3,1fr)}}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);background:var(--bg);color:var(--fg)}
.rail{display:none}
.shell{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar h2{font-size:18px;font-weight:700;margin-inline-end:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:flex;align-items:center;gap:9px;font:700 15px var(--font-display);letter-spacing:-.01em}
.logo svg{flex:none}
.main{overflow:auto;min-height:0;padding:14px 14px 22px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:700 10.5px/17px var(--font-body);text-align:center;padding:0 4px}
.sheet{position:absolute;inset:0;background:rgba(5,12,9,.5);display:flex;align-items:flex-end;z-index:30}
.sheet-in{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 14px 18px;display:grid;gap:4px}
.sheet-in button{display:flex;gap:12px;align-items:center;padding:12px 8px;border:0;background:none;border-radius:8px;font-weight:600;text-align:start;cursor:pointer}
.sheet-in button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.sheet-in svg{width:22px;height:22px;flex:none}

@container frame (min-width: 880px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:6px;padding:16px 12px;background:var(--surface);border-inline-end:1px solid var(--line);min-height:0;overflow:auto}
  .rail .logo{padding:2px 8px 14px}
  .tabs{display:none}
  .main{padding:22px 28px 30px}
  .topbar{padding:12px 28px}
  .topbar .logo{display:none}
}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;text-align:start;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.nav .badge{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:9px;min-width:20px;padding:0 6px;font:700 11px/20px var(--font-body);text-align:center}
.rail .spacer{flex:1}
.rail .foot{display:grid;gap:6px;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.rail .foot b{color:var(--fg)}

/* ---------- common components ---------- */
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:14px}
.stack.tight{gap:8px}
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.head h3{font-size:22px}
.head p{color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card>h4{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card>h4 small{font:500 12px var(--font-body);color:var(--muted)}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container frame (min-width: 880px){
  .cols.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cols.c21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .cols.c12{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
  .cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.fields{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container frame (min-width: 700px){.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=time],.field input[type=datetime-local],.field input[type=password],.field select,.field textarea,.inp{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--fg)}
.field textarea{min-height:76px;resize:vertical}
.field input[readonly]{background:var(--surface-2);color:var(--muted);font-family:var(--font-mono);font-size:13px}
.field .help{font-size:12px;color:var(--faint)}
.field .cnt{font-size:12px;color:var(--faint);text-align:end}
.field.err input,.field.err textarea{border-color:var(--bad)}
.field.err .help{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font:600 11.5px/1.6 var(--font-body);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.chip.x{padding-inline-end:5px}
.chip .rm{border:0;background:none;color:inherit;cursor:pointer;padding:0 3px;font-size:14px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line-strong);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(17px)}
[dir=rtl] .switch input:checked+span::after{transform:translateX(-17px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.check b{display:block;font-size:14px}
.check span{font-size:12.5px;color:var(--muted)}
.code{position:relative;font:12.5px/1.55 var(--font-mono);background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:11px 44px 11px 12px;overflow:auto;white-space:pre}
[dir=rtl] .code{direction:ltr;text-align:left}
.code .cp{position:absolute;top:6px;inset-inline-end:6px;min-height:26px;padding:0 8px;border-radius:5px;border:1px solid #2c4a3d;background:#16261f;color:#bfe7d3;font-size:11px;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid transparent;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.info{background:var(--info-bg);color:var(--info)}
.banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.good{background:var(--good-bg);color:var(--good)}
.banner b{color:inherit} .banner p{color:var(--fg)}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 18px var(--font-display);color:var(--fg);margin-bottom:4px}
.list{display:grid;gap:0}
.list>.li{display:grid;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center;grid-template-columns:minmax(0,1fr)}
.list>.li:first-child{border-top:0}
@container frame (min-width: 700px){.list.cols-act>.li{grid-template-columns:minmax(0,1fr) auto}}
.tag-tokens{font:600 11px var(--font-mono);color:var(--good);background:var(--good-bg);border-radius:4px;padding:1px 6px}
.toast{position:absolute;inset-inline:0;bottom:70px;display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast div{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;box-shadow:var(--shadow);animation:pop .2s ease-out}
@container frame (min-width: 880px){.toast{bottom:24px}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- inbox ---------- */
.inbox{display:grid;gap:10px}
.need{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-inline-start:4px solid var(--info);border-radius:10px;background:var(--surface)}
.need.gate{border-inline-start-color:var(--warn)} .need.fail{border-inline-start-color:var(--bad)} .need.ok{border-inline-start-color:var(--good)}
.need .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.need.gate .ic{background:var(--warn-bg);color:var(--warn)} .need.fail .ic{background:var(--bad-bg);color:var(--bad)}
.need .ic svg{width:19px;height:19px}
.need h4{font-size:15px} .need p{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.need{grid-template-columns:auto minmax(0,1fr)}.need .btn{grid-column:1/-1}}

/* ---------- scene ---------- */
.scene-wrap{position:relative;border-radius:12px;overflow:hidden;background:var(--scene-bg,#222);border:1px solid var(--line-strong);isolation:isolate}
.scene-wrap svg.scene{display:block;width:100%;height:auto}
.scene text{font-family:var(--font-display);font-weight:700;paint-order:stroke;stroke:var(--scene-halo,rgba(255,255,255,.75));stroke-width:3.4px;stroke-linejoin:round}
.hud{position:absolute;inset:0;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.hud .tl{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;align-items:center}
.hud .tr{position:absolute;top:10px;inset-inline-end:10px}
.glass{background:rgba(255,255,255,.88);color:#0f2233;border:1px solid rgba(0,0,0,.14);border-radius:999px;padding:5px 11px;font:700 12px var(--font-body);display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
button.glass{cursor:pointer}
.glass .led{width:9px;height:9px;border-radius:50%;background:#18a35a;box-shadow:0 0 0 3px rgba(24,163,90,.25)}
.glass .led.pause{background:#e3a93a;box-shadow:0 0 0 3px rgba(227,169,58,.25)}
.glass .led.stop{background:#d64545;box-shadow:0 0 0 3px rgba(214,69,69,.25)}
.glass.need{background:#fff1c9;border-color:#e3a93a;animation:pulse 1.6s ease-in-out infinite}
.glass.need.zero{background:rgba(255,255,255,.88);border-color:rgba(0,0,0,.14);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(227,169,58,.28)}}
.dock{margin-top:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;display:grid;gap:8px;box-shadow:var(--shadow);animation:pop .22s ease-out}
.dock[hidden]{display:none}
.dock .t{display:flex;gap:10px;align-items:center}
.dock .thumb{width:34px;height:54px;border-radius:5px;flex:none;border:1px solid var(--line-strong)}
.dock .t b{font-size:13.5px;display:block;line-height:1.25}
.dock .t span{font-size:12px;color:var(--muted)}
.bubble{position:absolute;z-index:5;transform:translate(-50%,-100%);max-width:min(250px,56%);background:#fff;color:#0f2233;border:2px solid var(--bub,#0f2233);border-radius:12px;padding:6px 9px 7px;font:500 12.5px/1.35 var(--font-body);box-shadow:0 6px 16px rgba(0,0,0,.28);animation:pop .22s ease-out;pointer-events:none}
.bubble b{display:block;font:700 10.5px var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--bub,#0f2233)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--bub,#0f2233);border-bottom:2px solid var(--bub,#0f2233);transform:translateX(-50%) rotate(45deg)}
.bubble.out{opacity:0;transition:opacity .5s}
.char.hop{animation:hop .5s ease-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px) scale(1.03)}}
.beltflow{animation:beltflow 1.1s linear infinite}
@keyframes beltflow{to{stroke-dashoffset:-18}}
.pulse-g{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.25}}
.under{display:grid;gap:14px;margin-top:14px}
@container frame (min-width: 880px){.under{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;font-size:13px}
.ev:first-child{border-top:0}
.ev time{font:500 11.5px var(--font-mono);color:var(--faint)}
.ev .k{font:600 11px var(--font-mono);color:var(--muted)}
.ev .who{font-weight:700}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{min-width:80px}
.stat b{display:block;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- review / studio ---------- */
.phone{width:min(100%,210px);aspect-ratio:9/16;border-radius:20px;border:6px solid #0a0f0d;overflow:hidden;position:relative;margin-inline:auto;background:#222;box-shadow:var(--shadow)}
.phone .poster{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:16px 12px;color:#fff}
.phone .poster h5{margin-bottom:auto!important;font:700 17px/1.15 var(--font-display);margin:0;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.phone .poster .cta{align-self:flex-start;margin-bottom:8px;background:#fff;color:#111;border-radius:999px;padding:4px 11px;font:700 11px var(--font-body)}
.phone .poster .cap{font:700 12px/1.2 var(--font-body);text-align:center;background:rgba(0,0,0,.45);border-radius:6px;padding:4px 6px}
.phone .bar{position:absolute;inset-inline:10px;bottom:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.phone .bar i{display:block;height:100%;border-radius:2px;background:#fff;width:34%;animation:prog 6s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.phone .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.phone .play span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.thumbs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.thumbs button{flex:none;width:56px;aspect-ratio:9/16;border-radius:6px;border:2px solid var(--line);padding:0;cursor:pointer;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.kbd{display:inline-block;font:600 11px var(--font-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}
.hold{position:relative;overflow:hidden;min-height:46px;width:100%;font-size:14px}
.hold i{position:absolute;inset:0;background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(0)}
.hold.go i{transition:transform 1.1s linear;transform:scaleX(1)}
[dir=rtl] .hold i{transform-origin:right}
.hold span{position:relative}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-display);background:var(--accent-soft);color:var(--accent-text)}
.step .n.done{background:var(--accent);color:var(--accent-ink)}
.acct{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.acct:first-of-type{border-top:0}
.acct .pf{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:700 11px var(--font-display);color:#fff}
.range{width:100%;accent-color:var(--accent)}
.radio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;align-items:start}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio b{display:block}.radio span{font-size:12.5px;color:var(--muted)}
.tabsx{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabsx button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabsx button[aria-current="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
.themes{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container frame (min-width: 700px){.themes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tcard{display:grid;gap:7px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:start;font:inherit;color:inherit}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard .mini{border-radius:6px;overflow:hidden;display:block;line-height:0}
.tcard .mini svg{width:100%;height:auto}
.tcard b{font:700 14px var(--font-display);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tcard small{color:var(--muted);font-size:12px}
.table{display:grid;gap:0}
.tr{display:grid;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;grid-template-columns:minmax(0,1fr) auto}
.tr:first-child{border-top:0}
@container frame (min-width: 700px){.tr.facts{grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) auto auto}.tr.plug{grid-template-columns:minmax(0,1fr) 110px minmax(0,1.6fr) auto}}
.meter{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.hl{font:700 11px var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.login{max-width:430px;margin:20px auto;display:grid;gap:16px}
.login .logo{font-size:20px}
.otp{font:600 26px var(--font-mono)!important;letter-spacing:.35em;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.reduce *{animation-duration:.001ms!important;animation-iteration-count:1!important}

.scene-col{position:relative}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.stat{gap:14px!important}.stat div{min-width:64px!important}
.bubble{max-width:min(215px,50%)!important}

.slot{position:relative}
.scene-wrap[data-mode="3d"] .slot{aspect-ratio:16/9}
@container frame (max-width: 879px){.scene-wrap[data-mode="3d"] .slot{aspect-ratio:3/5}}
canvas.three{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.three:active{cursor:grabbing}
.scene-wrap[data-mode="svg"] .only3d{display:none}
.hint{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(10,20,15,.62);color:#fff;border-radius:8px;padding:5px 9px;font:600 11.5px var(--font-body);max-width:min(70%,420px)}
.hud .tl{flex-wrap:wrap}

/* collapsible side menu (desktop) */
.railhead{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 4px 14px 8px}
.railhead .logo{padding:0}
.railtoggle{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.railtoggle:hover{color:var(--fg);border-color:var(--line-strong)}
.railtoggle svg{width:16px;height:16px;transition:transform .2s}
[dir=rtl] .railtoggle svg{transform:rotate(180deg)}
.app{transition:grid-template-columns .2s ease}
@container frame (min-width: 880px){
  .rail .logo{padding:0}
  .app[data-rail="min"]{grid-template-columns:72px minmax(0,1fr)}
  .app[data-rail="min"] .rail{padding-inline:10px;align-items:center}
  .app[data-rail="min"] .railhead{flex-direction:column;gap:10px;padding:2px 0 14px}
  .app[data-rail="min"] .railhead .logo span{display:none}
  .app[data-rail="min"] .railtoggle svg{transform:rotate(180deg)}
  [dir=rtl] .app[data-rail="min"] .railtoggle svg{transform:none}
  .app[data-rail="min"] .nav{justify-content:center;padding:10px;position:relative;width:48px}
  .app[data-rail="min"] .nav>span:not(.badge){display:none}
  .app[data-rail="min"] .nav .badge{position:absolute;top:1px;inset-inline-end:1px;min-width:17px;padding:0 4px;font-size:10px;line-height:17px}
  .app[data-rail="min"] .rail .foot{display:none}
}

/* ---------- twin: the factory page as a live digital twin ---------- */
.twin{display:flex;flex-direction:column;gap:10px}
.twstage{position:relative}
.twin .scene-wrap{border-radius:14px}
.hud-card{background:rgba(255,255,255,.94);color:#0f2233;border:1px solid rgba(255,255,255,.7);border-radius:12px;box-shadow:0 10px 28px rgba(6,18,36,.22),0 1px 2px rgba(6,18,36,.14);-webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25)}
.hud-tl{position:absolute;top:10px;inset-inline-start:10px;display:grid;gap:8px;justify-items:start;max-width:calc(100% - 20px)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.glass.live em{font-style:normal;font-size:11px;color:#3f5468;margin-inline-start:2px}
.tools{display:inline-flex;gap:4px;align-items:center;margin-inline-start:4px}
.tbtn{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#0f2233;border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(6,18,36,.16)}
.tbtn:hover{background:#fff}
.tbtn[aria-pressed="true"]{background:#0f2233;color:#fff;border-color:#0f2233}
.tbtn:focus-visible,.qrow:focus-visible,.steps button:focus-visible,.qtabs button:focus-visible,.pin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn svg{width:16px;height:16px}
.tbtn.sm{width:26px;height:26px;border-radius:8px;box-shadow:none}
.tbtn.sm svg{width:14px;height:14px}
.scene-wrap[data-mode="svg"] .tbtn.only3d{display:none}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{display:flex;align-items:center;gap:9px;padding:8px 13px 8px 9px;min-width:136px}
.kpi .ki{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.kpi .ki svg{width:17px;height:17px}
.kpi small{display:block;font:600 10.5px/1.2 var(--font-body);color:#56697c}
.kpi b{display:block;font:800 19px/1.1 var(--font-display);letter-spacing:-.02em}
.kpi em{display:block;font:500 10px/1.25 var(--font-body);color:#5f7387;font-style:normal;margin-top:1px;white-space:nowrap}
.kpi.warn{box-shadow:0 0 0 2px #f0b43c,0 10px 28px rgba(6,18,36,.22);animation:pulse 1.8s ease-in-out infinite}
.hud-tl{position:absolute}.hud-tl .hint{position:absolute!important;top:calc(100% + 6px);inset-inline-start:0!important;bottom:auto!important;transform:none;white-space:nowrap;max-width:none;animation:hintfade 9s ease-in forwards;pointer-events:none}
@keyframes hintfade{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
.pins{position:absolute;inset:0;pointer-events:none;z-index:4}
.pin{all:unset;box-sizing:border-box;position:absolute;transform:translate(-50%,-100%);margin-top:-12px;pointer-events:auto;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 10px 6px 7px;min-width:132px;max-width:196px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.7);border-radius:12px;box-shadow:0 8px 22px rgba(6,18,36,.26);color:#0f2233}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:rgba(255,255,255,.96);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.pin.amber{box-shadow:0 0 0 2px #f0b43c,0 8px 22px rgba(6,18,36,.26);animation:pulse 1.8s ease-in-out infinite}
.pin.red{box-shadow:0 0 0 2px #c23636,0 8px 22px rgba(6,18,36,.26)}
.pin .th{width:20px;height:32px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.18)}
.pin b{display:block;font:700 12px/1.2 var(--font-body)}
.pin small{display:block;font:500 10.5px/1.25 var(--font-body);color:#56697c}
.pin[hidden]{display:none}
/* stepper that follows one video */
.stepper{padding:9px 14px 8px;display:grid;gap:6px;min-width:0}
.stepper header{display:flex;align-items:center;gap:10px;min-width:0}
.th{display:inline-block;width:18px;height:28px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.18)}
.stepper .ti{min-width:0;flex:1}
.stepper .ti small{display:block;font:600 10px/1.1 var(--font-body);color:#56697c;text-transform:uppercase;letter-spacing:.06em}
.stepper .ti b{display:block;font:700 12.5px/1.25 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc{font-size:11px;color:#5f7387}
.stc{--chipc:#999;display:inline-block;font:700 10px/1 var(--font-body);padding:4px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--chipc) 16%,#fff);color:color-mix(in srgb,var(--chipc) 62%,#000);border:1px solid color-mix(in srgb,var(--chipc) 38%,#fff)}
.track{position:relative;padding-top:15px}
.track .line{position:absolute;top:calc(15px + 13px);inset-inline:calc(100%/14);height:3px;border-radius:2px;background:#d1dde9}
.track .fill{position:absolute;inset-block:0;inset-inline-start:0;width:calc(100% * var(--p,0));background:linear-gradient(90deg,#7cc8ff,#2f8fe8);border-radius:2px}
.marker{position:absolute;top:0;inset-inline-start:calc(100%/14 + (100% - 100%/7) * var(--p,0));width:15px;height:21px;border-radius:4px;transform:translateX(-50%);border:1.5px solid #fff;box-shadow:0 3px 8px rgba(6,18,36,.35);z-index:3}
.marker::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:1px;z-index:-1}
[dir=rtl] .marker{transform:translateX(50%)}
.marker[hidden]{display:none}
.steps{list-style:none;margin:0;padding:0;display:flex}
.steps li{flex:1;min-width:0;text-align:center;position:relative;z-index:1}
.steps button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;width:100%;padding:0 2px;box-sizing:border-box}
.steps .sd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #c6d4e1;color:#8497ab}
.steps .sd svg{width:14px;height:14px}
.steps li.done .sd{background:var(--sc);border-color:var(--sc);color:#fff}
.steps li.cur .sd{border-color:var(--sc);color:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 24%,transparent)}
.steps li.wait .sd{border-color:#e0a21a;color:#b57900;background:#fff6dc;animation:pulse 1.6s ease-in-out infinite}
.steps b{font:700 10.5px/1.15 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.steps small{font:500 9.5px/1.1 var(--font-mono);color:#5f7387;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.steps li.todo b{color:#7a8fa3}
.stepper .cap{display:none;font:600 11.5px/1.3 var(--font-body);color:#2b4054;text-align:center}
/* queue table */
.qtable{padding:8px 10px 7px;display:grid;gap:6px;min-width:0}
.qtabs{display:flex;gap:4px}
.qtabs button{all:unset;cursor:pointer;box-sizing:border-box;padding:4px 10px;border-radius:8px;font:700 11.5px var(--font-body);color:#46596d}
.qtabs button b{margin-inline-start:5px;opacity:.75;font-weight:700}
.qtabs button[aria-selected="true"]{background:#0f2233;color:#fff}
.qrows{display:grid;gap:2px;max-height:78px;overflow:auto;align-content:start}
.qrow{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:4px 6px;border-radius:8px}
.qrow:hover,.qrow.on{background:#e6eff8}
.qrow .tx{min-width:0}
.qrow .tx b{display:block;font:700 11.5px/1.25 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx small{display:block;font:500 10px/1.2 var(--font-mono);color:#5f7387}
.qe{margin:6px 4px;font:500 11.5px var(--font-body);color:#5f7387}
/* station panel */
.panel{position:absolute;top:10px;inset-inline-end:10px;width:296px;max-height:calc(100% - 20px);overflow:auto;z-index:5;padding:12px 13px 11px;display:none}
.panel.open{display:block}
.panel header{display:flex;gap:10px;align-items:center}
.panel .pic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.panel .pt{min-width:0}
.panel .pt b{display:block;font:700 14.5px/1.2 var(--font-display)}
.panel .pt small{display:flex;align-items:center;gap:5px;font:500 11px var(--font-body);color:#56697c;margin-top:1px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aaabb}
.sdot.work{background:#1f9d62;box-shadow:0 0 0 3px rgba(31,157,98,.25)}.sdot.wait{background:#e0a21a;box-shadow:0 0 0 3px rgba(224,162,26,.3)}.sdot.ok{background:#2a62c9}
.pbtns{margin-inline-start:auto;display:flex;gap:4px;align-self:flex-start}
.pmode{margin:8px 0 2px;font:600 10px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#7589a0}
.pr{padding:7px 0;border-top:1px solid #e1e9f1}
.pr:first-child{border-top:0}
.pl{display:flex;justify-content:space-between;gap:10px;font:500 12px var(--font-body);color:#3f5468}
.pl b{font:700 12.5px var(--font-body);color:#0f2233;text-align:end}
.pbar{height:5px;border-radius:3px;background:#e1e9f1;margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--c,#1f9d62)}
.panel footer{margin-top:10px}
/* overlay layout (desktop + 3D): everything floats over the scene */
.twin[data-layout="overlay"] .scene-wrap[data-mode="3d"] .slot{aspect-ratio:auto;height:clamp(520px,calc(min(86vh,840px) - 144px),720px)}
.twin[data-layout="overlay"] .stepper{position:absolute;z-index:6;inset-inline:10px calc(10px + 296px + 10px);bottom:10px}
.twin[data-layout="overlay"] .qtable{position:absolute;z-index:6;inset-inline-end:10px;bottom:10px;width:296px}
.twin[data-layout="overlay"] .panel{width:296px;max-height:calc(100% - 30px - var(--tbl-h,140px))}
/* compact layout (phone, narrow, 2D): scene on top, the rest flows below */
.twin[data-layout="compact"] .twstage{display:contents}
.twin[data-layout="compact"] .scene-wrap{order:0}
.twin[data-layout="compact"] .dock{order:1;margin-top:0}
.twin[data-layout="compact"] .stepper{order:2}
.twin[data-layout="compact"] .qtable{order:3}
.twin[data-layout="compact"] .stepper,.twin[data-layout="compact"] .qtable{background:var(--surface);color:var(--fg);border-color:var(--line-strong);box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.twin[data-layout="compact"] .hint{display:none}
.twin[data-layout="compact"] .tbtn.wide{display:none}
.twin[data-layout="compact"] .glass.ib span{display:none}
.twin[data-layout="compact"] .glass.ib{padding:6px 8px}
.twin[data-layout="compact"] .kpis{flex-wrap:nowrap;gap:5px;max-width:100%;overflow:hidden}
.twin[data-layout="compact"] .kpi{min-width:0;padding:5px 9px 5px 6px;gap:6px;border-radius:999px}
.twin[data-layout="compact"] .kpi .ki{width:22px;height:22px;border-radius:50%}
.twin[data-layout="compact"] .kpi .ki svg{width:13px;height:13px}
.twin[data-layout="compact"] .kpi div{display:flex;align-items:baseline;gap:5px}
.twin[data-layout="compact"] .kpi b{font-size:14px}
.twin[data-layout="compact"] .kpi small{order:2;font-size:10px}
.twin[data-layout="compact"] .kpi em{display:none}
.twin[data-layout="compact"] .kpi:nth-child(n+4){display:none}
.twin[data-layout="compact"] .steps b,.twin[data-layout="compact"] .steps small{display:none}
.twin[data-layout="compact"] .stepper .cap{display:block}
.twin[data-layout="compact"] .stepper{padding:9px 12px 10px}
.twin[data-layout="compact"] .stepper .th+.ti small{display:none}
.twin[data-layout="compact"] .qrows{max-height:none}
.twin[data-layout="compact"] .stepper .idc{display:none}
.twin[data-layout="compact"] .panel{inset-inline:8px;bottom:8px;top:auto;width:auto;max-height:64%}
.twin[data-layout="compact"] .qtable .qtabs button{color:var(--muted)}
.twin[data-layout="compact"] .qtable .qtabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.twin[data-layout="compact"] .qrow:hover,.twin[data-layout="compact"] .qrow.on{background:var(--surface-2)}
.twin[data-layout="compact"] .qrow .tx small,.twin[data-layout="compact"] .qe{color:var(--muted)}
.twin[data-layout="compact"] .stepper .ti small{color:var(--muted)}
.twin[data-layout="compact"] .stepper .cap{color:var(--fg)}
.twin[data-layout="compact"] .steps small,.twin[data-layout="compact"] .steps li.todo b{color:var(--faint)}
.twin[data-layout="compact"] .track .line{background:var(--line-strong)}
.twin[data-layout="compact"] .steps .sd{background:var(--surface);border-color:var(--line-strong)}
.twin[data-layout="compact"] .steps li.done .sd{background:var(--sc);border-color:var(--sc)}
@media (prefers-reduced-motion:reduce){.kpi.warn,.pin.amber,.steps li.wait .sd,.hint{animation:none}}

.twin[data-layout="compact"] .scene-wrap[data-mode="3d"] .slot{max-height:clamp(440px,76vh,680px)}

/* documentation shots: ?hud=0 hides every overlay and shows the bare scene */
.twin[data-hud="0"] .hud,.twin[data-hud="0"] .stepper,.twin[data-hud="0"] .qtable{display:none}

</head>
<body>
<div class="page">
  <header class="proto">
    <div class="ttl"><h1 id="pTitle"></h1><span class="sub" id="pSub"></span></div>
    <div class="ctl">
      <label class="l"><span id="lblScreen"></span><select id="screenSel"></select></label>
      <label class="l"><span id="lblTheme"></span><select id="themeSel"></select></label>
      <label class="l"><span id="lblView"></span><select id="viewSel"></select></label>
      <div class="seg" id="devSeg" role="group" aria-label="Device"><button data-d="desktop" aria-pressed="true">Desktop</button><button data-d="phone" aria-pressed="false">Phone</button></div>
      <div class="seg" id="langSeg" role="group" aria-label="Language"><button data-l="en" aria-pressed="false">EN</button><button data-l="pt-BR" aria-pressed="false">PT-BR</button></div>
      <label class="tick"><input type="checkbox" id="autoChk"><span id="lblAuto"></span></label>
      <label class="tick"><input type="checkbox" id="rtlChk"><span id="lblRtl"></span></label>
      <label class="tick"><input type="checkbox" id="upChk"><span id="lblUp"></span></label>
    </div>
  </header>
  <div class="stage">
    <div class="frame" id="frame" data-device="desktop">
      <div class="app" id="app">
        <aside class="rail" id="rail"></aside>
        <div class="shell">
          <header class="topbar">
            <div class="logo" id="topLogo"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="14" width="26" height="9" rx="4.5" fill="var(--accent)"/><circle cx="8" cy="18.5" r="1.6" fill="var(--accent-ink)"/><circle cx="14" cy="18.5" r="1.6" fill="var(--accent-ink)"/><circle cx="20" cy="18.5" r="1.6" fill="var(--accent-ink)"/><rect x="5" y="5" width="8" height="7" rx="2" fill="var(--fg)"/><rect x="16" y="8" width="7" height="4" rx="1.5" fill="var(--fg)" opacity=".55"/></svg></div>
            <h2 id="ttl"></h2>
            <button class="glass need" id="needTop" data-go="inbox" hidden></button>
          </header>
          <main class="main" id="main"></main>
          <nav class="tabs" id="tabs"></nav>
        </div>
        <div id="sheetHost"></div>
      </div>
    </div>
  </div>
  <section class="notes"><p id="n1"></p><p id="n2"></p><p id="n3"></p></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>

const STAGE_ROLE={brand:'brander',ideas:'ideator',make:'director',review:'gatekeeper',publish:'poster',metrics:'analyst',report:'reflector'};

  review:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',

const ico=(n,x='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${x}>${ICON[n]}</svg>`;

function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}

/* ---------- themes (br is the MVP theme; the rest are concepts that show the format) ---------- */
const grad=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const star=(x,y,r,f)=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+' '+(y+Math.sin(a)*rr).toFixed(1)}return `<path d="${d}Z" fill="${f}"/>`};

const pat=(id,w,h,inner)=>`<pattern id="${id}" width="${w}" height="${h}" patternUnits="userSpaceOnUse">${inner}</pattern>`;

function charSVG(role,th){
  const p=th.p,ink=p.ink,body=p.body,head=p.head,dark=shade(body,-.25);let acc='',top='';
  const ant=`<line x1="0" y1="-80" x2="0" y2="-88" stroke="${ink}" stroke-width="2"/><circle cx="0" cy="-90" r="3.4" fill="${p.accent}" stroke="${ink}" stroke-width="1.4"/>`;
  if(role==='brander'){acc=`<g><path d="M24 -26L38 -50" stroke="${ink}" stroke-width="3" stroke-linecap="round"/><ellipse cx="39.5" cy="-53" rx="4.5" ry="6" fill="${p.accent}" stroke="${ink}" stroke-width="1.6" transform="rotate(25 39.5 -53)"/></g><circle cx="-22" cy="-24" r="7" fill="${p.accent}" stroke="${ink}" stroke-width="1.6"/>`;top=ant}
  else if(role==='ideator'){top=`<line x1="0" y1="-80" x2="0" y2="-86" stroke="${ink}" stroke-width="2"/><circle cx="0" cy="-95" r="8.5" fill="#ffe27a" stroke="${ink}" stroke-width="1.8"/><path d="M-13 -99l-6 -2M13 -99l6 -2M0 -108v-6" stroke="${p.accent}" stroke-width="2" stroke-linecap="round"/>`}
  else if(role==='director'){acc=`<g transform="translate(25 -38) rotate(-12)"><rect x="0" y="4" width="22" height="14" rx="2" fill="${ink}"/><rect x="0" y="-3" width="22" height="7" rx="2" fill="#fff" stroke="${ink}" stroke-width="1.6"/><path d="M4 -3l4 7M11 -3l4 7M18 -3l3 7" stroke="${ink}" stroke-width="1.6"/></g>`;top=ant}
  else if(role==='gatekeeper'){top=`<path d="M-21 -78Q0 -106 21 -78Z" fill="#ffd23f" stroke="${ink}" stroke-width="2"/><rect x="-24" y="-80" width="48" height="5" rx="2.5" fill="#ffd23f" stroke="${ink}" stroke-width="2"/>`;acc=`<line x1="34" y1="0" x2="34" y2="-52" stroke="${ink}" stroke-width="3"/><circle cx="34" cy="-62" r="11" fill="${p.gate}" stroke="${ink}" stroke-width="2"/><rect x="27" y="-64" width="14" height="4" rx="1" fill="#fff"/>`}
  else if(role==='poster'){acc=`<g transform="translate(24 -34) rotate(-18)"><path d="M0 -6L22 -14V14L0 6Z" fill="${p.accent}" stroke="${ink}" stroke-width="1.8"/><rect x="-8" y="-6" width="9" height="12" rx="2" fill="${ink}"/></g>`;top=ant}

  else if(role==='reflector'){acc=`<ellipse cx="35" cy="-42" rx="9" ry="12" fill="#cfeaff" stroke="${ink}" stroke-width="2"/><path d="M31 -48q4 -4 8 0" stroke="#fff" stroke-width="2" fill="none"/><path d="M35 -30L35 -22" stroke="${ink}" stroke-width="3"/>`;top=ant}
  else {top=`<path d="M0 -80V-92" stroke="${ink}" stroke-width="2.4"/><path d="M0 -92q-12 -2 -14 -12q10 0 14 12z" fill="#5cc66b" stroke="${ink}" stroke-width="1.6"/><path d="M0 -92q12 -2 14 -12q-10 0 -14 12z" fill="#7fd98a" stroke="${ink}" stroke-width="1.6"/>`}
  const leg=`<rect x="-12" y="-9" width="9" height="10" rx="3" fill="${dark}" stroke="${ink}" stroke-width="1.6"/><rect x="3" y="-9" width="9" height="10" rx="3" fill="${dark}" stroke="${ink}" stroke-width="1.6"/>`;
  return `<g class="char"><ellipse cx="0" cy="1" rx="22" ry="4.5" fill="rgba(0,0,0,.22)"/>${leg}<rect x="-24" y="-38" width="9" height="20" rx="4.5" fill="${body}" stroke="${ink}" stroke-width="1.8"/><rect x="15" y="-38" width="9" height="20" rx="4.5" fill="${body}" stroke="${ink}" stroke-width="1.8"/><rect x="-15" y="-44" width="30" height="38" rx="11" fill="${body}" stroke="${ink}" stroke-width="2"/>${th.badge(p)}<rect x="-19" y="-82" width="38" height="38" rx="14" fill="${head}" stroke="${ink}" stroke-width="2"/><circle cx="-7" cy="-64" r="3.4" fill="${ink}"/><circle cx="7" cy="-64" r="3.4" fill="${ink}"/><path d="M-5 -55Q0 -51 5 -55" stroke="${ink}" stroke-width="2" fill="none" stroke-linecap="round"/>${acc}${top}</g>`;

function kioskSVG(stage,th,w,h,wallY,x,iconOnly){
  const p=th.p,ink=p.ink,cx=x+w/2;
  return `<g><rect x="${x}" y="${wallY}" width="${w}" height="${h}" rx="9" fill="${p.wall}" stroke="${ink}" stroke-width="3"/>
  <path d="M${x-9} ${wallY+2}L${x+w+9} ${wallY+2}L${x+w-4} ${wallY-26}L${x+4} ${wallY-26}Z" fill="${p.roof}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>
  <rect x="${x-3}" y="${wallY-1}" width="${w+6}" height="7" rx="3" fill="${p.accent}" stroke="${ink}" stroke-width="2"/>
  <circle cx="${cx}" cy="${wallY+h/2+6}" r="25" fill="#fff" stroke="${ink}" stroke-width="2.4"/>
  <g transform="translate(${cx-17} ${wallY+h/2-11}) scale(1.42)" fill="none" stroke="${ink}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[stage==='brand'?'brand':stage==='ideas'?'ideas':stage==='make'?'studio':stage==='review'?'review':stage==='publish'?'publish':stage==='metrics'?'metrics':'report']}</g></g>`;
}

function place(side,sx,sy){ // kiosk wall rect, label, character feet
  const w=104,h=84;
  if(side==='top'){const ky=sy-34-h;return{kx:sx-w/2,ky,cx:sx+70,cy:sy-30,lx:sx,ly:ky-32}}
  if(side==='bottom'){const ky=sy+60;return{kx:sx-w/2,ky,cx:sx-76,cy:sy+142,lx:sx,ly:ky+h+26}}
  if(side==='right'){const ky=sy-h/2-8;return{kx:sx+36,ky,cx:sx+88,cy:sy+h/2+96,lx:sx+36+w/2,ly:ky-32}}
  const ky=sy-h/2-8;return{kx:sx-36-w,ky,cx:sx-88,cy:sy+h/2+96,lx:sx-36-w/2,ly:ky-32};
}
function sceneSVG(th,variant,o){
  o=o||{};const g=GEO[variant],[W,H]=g.vb,u=o.uid||'x',p=th.p,mini=!!o.mini;
  let st='',ch='';
  STAGES.forEach(s=>{const [sx,sy,side]=g.st[s],pl=place(side,sx,sy);
    st+=kioskSVG(s,th,104,84,pl.ky,pl.kx);
    if(!mini)st+=`<text class="lab" x="${pl.lx}" y="${pl.ly}" text-anchor="middle" font-size="${variant==='portrait'?23:19}" data-lab="${s}" style="fill:#fff;stroke:rgba(0,0,0,.6);stroke-width:3.4px"></text>`;
    ch+=`<g transform="translate(${pl.cx} ${pl.cy}) scale(${variant==='portrait'?.95:.9})" data-role="${STAGE_ROLE[s]}">${charSVG(STAGE_ROLE[s],th)}</g>`;
    if(s==='report')ch+=`<g transform="translate(${pl.cx+(side==='bottom'?-52:50)} ${pl.cy}) scale(.82)" data-role="evolver">${charSVG('evolver',th)}</g>`;
  });
  const bin=g.bin;
  const binSVG=mini?'':`<g transform="translate(${bin[0]} ${bin[1]})"><path d="M-22 -26H22L17 22H-17Z" fill="#6b7280" stroke="${p.ink}" stroke-width="3"/><path d="M-26 -26H26" stroke="${p.ink}" stroke-width="5" stroke-linecap="round"/><path d="M-8 -12V12M0 -12V12M8 -12V12" stroke="#d1d5db" stroke-width="2.4"/><text class="lab" x="0" y="48" text-anchor="middle" font-size="20" data-lab="bin" style="fill:#fff;stroke:rgba(0,0,0,.6);stroke-width:3.4px"></text></g>`;
  const miniChars=mini?`<g transform="translate(300 430) scale(1.6)">${charSVG('brander',th)}</g><g transform="translate(640 430) scale(1.6)">${charSVG('gatekeeper',th)}</g><g transform="translate(980 430) scale(1.6)">${charSVG('poster',th)}</g>`:'';
  const miniBelt=mini?`<path d="M0 440H1280" stroke="${p.ink}" stroke-width="48"/><path d="M0 440H1280" stroke="${p.belt}" stroke-width="40"/><path d="M0 440H1280" stroke="${p.line}" stroke-width="3" stroke-dasharray="2 16"/>`:'';
  const inner=mini
   ?`${th.decor(W,H,u)}${miniBelt}${miniChars}`
   :`${th.decor(W,H,u)}
     <path d="${g.path}" fill="none" stroke="${p.ink}" stroke-width="48" stroke-linejoin="round"/>
     <path id="beltPath" d="${g.path}" fill="none" stroke="${p.belt}" stroke-width="40"/>
     <path d="${g.path}" fill="none" stroke="${p.line}" stroke-width="3" stroke-dasharray="2 16" class="beltflow"/>
     ${st}${ch}${binSVG}<g id="barriers"></g><g id="items"></g>`;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Factory scene">${inner}</svg>`;
}

/* ---------- simulation (canonical progress: 0..8, station k sits at k) ---------- */
const SIM={items:[],spawn:1.2,next:1,time:0,cycle:1,anchors:{}};
const SPEED=150,GAP_PX=72,DWELL=1.2;
const GATES={review:{at:4-.34,kind:'review'},publish:{at:5-.34,kind:'publish'}};
function mkItem(){const i=SIM.next++,h=HOOKS[S.lang][(i-1)%5];return{id:'itm_'+String(i).padStart(2,'0'),n:i,t0:SIM.time,times:{},hook:h,fam:FAM[(i-1)%5],c:0,mode:'move',until:0,state:'idea',passed:{},gold:i%3===0,cracked:false,fade:0,after:null,q:null}}
function segLen(c){const v=Scene.variant||'landscape',a=SIM.anchors[v],i=Math.min(7,Math.max(0,Math.floor(c)));return Math.max(60,(a[i+1]-a[i])*(SIM.len[v]))}
function stepSim(dt){
  if(S.loop!=='running')return;SIM.time+=dt;for(const d of SIM.items)if(d.dead)d.fade+=dt*1.6;
  const live=SIM.items.filter(i=>!i.dead);
  SIM.spawn-=dt;if(SIM.spawn<=0&&live.length<3&&live.every(i=>i.c>1.1)){SIM.items.push(mkItem());SIM.spawn=4.5}
  const order=[...live].sort((a,b)=>b.c-a.c);let ahead=null;
  for(const it of order){
    if(it.mode==='dwell'){if(SIM.time>=it.until){it.mode='move';if(it.after){const f=it.after;it.after=null;f(it)}}else{ahead=it;continue}}
    if(it.mode==='wait'){ahead=it;continue}
    let target=it.c+SPEED*dt/segLen(it.c);
    if(ahead){const lim=ahead.c-GAP_PX/segLen(ahead.c);target=Math.min(target,Math.max(it.c,lim))}
    for(let k=1;k<=7;k++){if(it.passed[k])continue;const g=k===4?GATES.review:k===5?GATES.publish:null;const at=g?g.at:k;
      if(it.c<=at&&target>=at){target=at;it.passed[k]=true;arrive(it,k);break}}
    it.c=Math.max(it.c,target);ahead=it;
    if(it.c>=8&&it.mode==='move'){it.dead=true}
  }
  if(S.auto)for(const q of [...S.queue])if(q.sim&&SIM.time-q.since>2.4)approve(q,true);
  if(S.auto)for(const p of [...S.pubq])if(p.sim&&SIM.time-p.since>2.4)confirmPost(p,true);
  SIM.items=SIM.items.filter(i=>!i.dead||i.fade<1);
}
function dwell(it,s,after){it.mode='dwell';it.until=SIM.time+s;it.after=after||null}
function arrive(it,k){
  (it.times=it.times||{})[k]=new Date();
  if(k===1){emit('brand.checked',{facts:FACTS.length});dwell(it,DWELL)}
  else if(k===2){it.state='drafted';emit('ideas.generated',{n:5});dwell(it,DWELL)}
  else if(k===3){emit('make.started');dwell(it,DWELL*1.7,x=>{x.state='rendered';emit('make.rendered',{s:15})})}
  else if(k===4){it.mode='wait';it.state='in_review';const q={id:it.id,hook:it.hook,fam:it.fam,n:it.n,sim:it,since:SIM.time,dur:15,hash:hex(it.id+it.hook)};S.queue.push(q);it.q=q;emit('gate.review');refresh('gate')}
  else if(k===5){it.mode='wait';it.state='scheduled';const p={id:it.id,hook:it.hook,fam:it.fam,n:it.n,sim:it,since:SIM.time,hash:hex('pub'+it.id)};S.pubq.push(p);it.p=p;emit('publish.previewed',{n:2,when:t('when.slot')});emit('gate.publish');refresh('gate')}
  else if(k===6){it.state='measured';emit('metrics.ingested',{d:3,views:'4,1k',delta:'+38%'});dwell(it,DWELL)}
  else if(k===7){it.state='archived';emit('report.generated',{family:t('fam.'+it.fam),n:9});setTimeout(()=>emit('hints.generated',{family:t('fam.'+it.fam)}),900);SIM.cycle++;dwell(it,DWELL*1.4)}
}
function approve(q,auto){const i=S.queue.indexOf(q);if(i<0)return;S.queue.splice(i,1);if(S.rv>=S.queue.length)S.rv=Math.max(0,S.queue.length-1);
  const it=q.sim;emit('review.approved',{auto:auto?1:0});
  if(it){it.state='approved';it.mode='move'}else{S.pubq.push({id:q.id,hook:q.hook,fam:q.fam,n:q.n,since:SIM.time,hash:hex('pub'+q.id)})}
  refresh('gate')}
function discard(q,kind){const i=S.queue.indexOf(q);if(i<0)return;S.queue.splice(i,1);if(S.rv>=S.queue.length)S.rv=Math.max(0,S.queue.length-1);emit(kind==='changes'?'review.changes':'review.discarded');
  if(q.sim){q.sim.dead=true;q.sim.cracked=kind!=='changes'}refresh('gate')}
function confirmPost(p,auto){const i=S.pubq.indexOf(p);if(i<0)return;S.pubq.splice(i,1);emit('publish.published',{auto:auto?1:0});S.done++;S.posted.unshift({id:p.id,hook:p.hook,n:p.n,ts:new Date()});
  const it=p.sim;if(it){it.state='published';it.mode='dwell';it.until=SIM.time+DWELL;it.after=null}refresh('gate');toast(t('toast.posted'))}
function failItem(){const it=SIM.items.filter(i=>!i.dead&&i.c>.5&&i.mode!=='wait').sort((a,b)=>b.c-a.c)[0];if(!it){toast(t('toast.nothing'));return}
  it.dead=true;it.cracked=true;S.fails.push({id:it.id,hook:it.hook});emit('item.failed');refresh('gate')}

const SceneSVG={host:null,svg:null,variant:null,path:null,len:{},charPos:{},ro:null,hidden:false,els:new Map(),
  pick(){return $('#frame').clientWidth>=880?'landscape':'portrait'},
  mount(h){this.host=h;h.dataset.mode='svg';this.build();this.ro=('ResizeObserver' in window)?new ResizeObserver(()=>{if(this.pick()!==this.variant)this.build();this.layout()}):null;if(this.ro)this.ro.observe($('#frame'))},
  unmount(){if(this.ro)this.ro.disconnect();this.host=null;this.svg=null;this.els.clear()},
  build(){this.variant=this.pick();const th=TCUR(),slot=$('.slot',this.host);slot.innerHTML=sceneSVG(th,this.variant,{uid:'m'});this.svg=slot.firstChild;
    this.host.style.setProperty('--scene-bg',th.p.sky1);this.path=$('#beltPath',this.svg);this.els.clear();
    const g=GEO[this.variant],pos={};STAGES.forEach(s=>{const [sx,sy,side]=g.st[s],pl=place(side,sx,sy),k=this.variant==='portrait'?.95:.9;pos[STAGE_ROLE[s]]={x:pl.cx,y:pl.cy-0*k}});pos.evolver={x:pos.reflector.x,y:pos.reflector.y};this.charPos=pos;
    $$('[data-lab]',this.svg).forEach(n=>{const k=n.getAttribute('data-lab');n.textContent=k==='bin'?t('bin'):t('station.'+k)});
    this.barriers();this.layout()},
  barriers(){const g=$('#barriers',this.svg),v=this.variant,a=SIM.anchors[v],len=SIM.len[v];let h='';
    [['review',4],['publish',5]].forEach(([k,idx])=>{const c=GATES[k].at+.12,i=Math.floor(c),f=a[i]+(a[i+1]-a[i])*(c-i),pt=this.path.getPointAtLength(f*len),pt2=this.path.getPointAtLength(Math.min(len,f*len+4)),ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
      h+=`<g transform="translate(${pt.x} ${pt.y}) rotate(${ang})" data-bar="${k}"><g class="arm" transform="rotate(90)"><rect x="-4" y="-24" width="8" height="48" rx="3" fill="#fff" stroke="${TCUR().p.ink}" stroke-width="2"/><rect x="-4" y="-18" width="8" height="9" fill="${TCUR().p.gate}"/><rect x="-4" y="0" width="8" height="9" fill="${TCUR().p.gate}"/></g></g>`});g.innerHTML=h;this.bars()},
  bars(){if(!this.svg)return;$$('[data-bar]',this.svg).forEach(n=>{const k=n.getAttribute('data-bar'),open=!S.queue.concat(S.pubq).some(x=>x.sim&&((k==='review'&&S.queue.includes(x))||(k==='publish'&&S.pubq.includes(x))));const arm=$('.arm',n);arm.setAttribute('transform',open?'rotate(10) translate(0 -12)':'rotate(90)');arm.style.opacity=open?.55:1})},
  bubble(ev){const role=STAGE_ROLE[ev.stage],pos=this.charPos[role];if(!pos)return;const old=$$('.bubble',this.host);while(old.length>=2)old.shift().remove();
    const el=document.createElement('div');el.className='bubble';el.style.setProperty('--bub',SC[ev.stage]);el.innerHTML=`<b>${esc(charName(role))}</b>${esc(phrase(ev))}`;this.host.appendChild(el);this.placeEl(el,pos.x,pos.y-(this.variant==='portrait'?112:104)-(old.length?58:0));
    const g=this.svg&&this.svg.querySelector(`[data-role="${role}"] .char`);if(g){g.classList.remove('hop');void g.getBoundingClientRect();g.classList.add('hop')}
    if(!S.keep){setTimeout(()=>el.classList.add('out'),S.reduce?5200:3800);setTimeout(()=>el.remove(),S.reduce?5800:4400)}},
  relabelBin(){this.layout()},
  layout(){const bin=$('[data-lab="bin"]',this.svg);if(bin)bin.textContent=t('bin')+(S.fails.length?' · '+S.fails.length:'')},
  place(c){const a=SIM.anchors[this.variant],i=Math.min(7,Math.floor(c)),f=a[i]+(a[i+1]-a[i])*(c-i),len=SIM.len[this.variant];return this.path.getPointAtLength(Math.min(len,Math.max(0,f*len)))},
  scale(){const r=this.svg.getBoundingClientRect(),vb=GEO[this.variant].vb;return r.width/vb[0]},
  placeEl(el,x,y){const k=this.scale();el.style.left=Math.max(24,Math.min(this.svg.getBoundingClientRect().width-24,x*k))+'px';el.style.top=Math.max(40,y*k)+'px'},
  draw(){if(!this.svg||!this.path)return;const g=$('#items',this.svg),live=SIM.items;
    for(const [id,el] of this.els)if(!live.some(i=>i.id===id)){el.remove();this.els.delete(id)}
    for(const it of live){let el=this.els.get(it.id);if(!el){el=document.createElementNS('http://www.w3.org/2000/svg','g');el.innerHTML=cartridge();g.appendChild(el);this.els.set(it.id,el)}
      const p=this.place(Math.min(it.c,7.999));el.setAttribute('transform',`translate(${p.x} ${p.y})`);
      const col=it.cracked?'#7a1f1f':STATECOL[it.state]||'#999';$('.body',el).setAttribute('fill',col);
      $('.gold',el).style.display=(it.gold&&['published','measured','archived'].includes(it.state))?'':'none';$('.crack',el).style.display=it.cracked?'':'none';
      el.style.opacity=it.dead?Math.max(0,1-it.fade):1}}
};

const STATECOL={idea:'#9aa3a0',drafted:'#6a5acd',rendered:'#3b82f6',in_review:'#f0a81c',approved:'#22a35a',scheduled:'#14b8a6',published:'#facc15',measured:'#0d9488',archived:'#94a3b8'};
function cartridge(){return `<g><circle class="gold pulse-g" r="30" fill="#ffe27a" opacity=".55" style="display:none"/><rect class="body" x="-14" y="-19" width="28" height="38" rx="6" fill="#999" stroke="#10201a" stroke-width="2.4"/><rect x="-9" y="-12" width="18" height="12" rx="2" fill="#fff" opacity=".9"/><circle cx="-6" cy="9" r="2.2" fill="#10201a"/><circle cx="6" cy="9" r="2.2" fill="#10201a"/><path class="crack" d="M-12 -18L-2 -4 -9 4 2 19" stroke="#fff" stroke-width="2.4" fill="none" style="display:none"/></g>`}
function geoInit(){const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('width','0');s.setAttribute('height','0');s.style.cssText='position:absolute;visibility:hidden';document.body.appendChild(s);
  for(const v of ['landscape','portrait']){const p=document.createElementNS(ns,'path');p.setAttribute('d',GEO[v].path);s.appendChild(p);const len=p.getTotalLength();SIM.len=SIM.len||{};SIM.len[v]=len;
    const arr=[0];STAGES.forEach(st=>{const [x,y]=GEO[v].st[st];let best=0,bd=1e9;for(let l=0;l<len;l+=3){const q=p.getPointAtLength(l),d=(q.x-x)**2+(q.y-y)**2;if(d<bd){bd=d;best=l}}arr.push(best/len)});arr.push(1);SIM.anchors[v]=arr}
  geo3();s.remove()}

${S.canUpload?'':`<p style="font-size:12px;color:var(--warn);margin-top:8px">${t('pub.hold.off')}</p><button class="btn" style="margin-top:10px;width:100%" data-act="export">${t('pub.export')}</button>`}
